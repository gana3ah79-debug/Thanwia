<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>رحلة الثانوية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#172033}body{padding-bottom:24px}.app{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 18px rgba(20,35,70,.06)}h1,h2,h3{margin:0 0 10px}.muted{color:#697386}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grid{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{border:0;border-radius:13px;padding:12px 14px;font-size:15px;cursor:pointer;background:#e9edf5;color:#172033}.btn.primary{background:#315efb;color:#fff}.btn.success{background:#16a56a;color:#fff}.btn.danger{background:#e34d59;color:#fff}.btn:disabled{opacity:.5}.input,.textarea,.select{width:100%;padding:12px;border:1px solid #d9deea;border-radius:12px;background:#fff;font-size:15px}.textarea{min-height:130px;resize:vertical}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap}.tab.active{background:#315efb;color:#fff}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#315efb;font-size:12px}.hero{background:linear-gradient(135deg,#315efb,#7048e8);color:#fff;border:0}.stat{font-size:24px;font-weight:800}.question{padding:14px;border:1px solid #e1e6f0;border-radius:14px;margin:10px 0}.option{display:block;width:100%;text-align:right;margin:7px 0;padding:12px;border:1px solid #dfe4ee;background:#fff;border-radius:11px}.option.selected{border-color:#315efb;background:#eef2ff}.correct{border-color:#16a56a!important;background:#ecfbf4!important}.wrong{border-color:#e34d59!important;background:#fff0f1!important}.hidden{display:none!important}.loading{padding:20px;text-align:center}.topbar{position:sticky;top:0;z-index:5;background:#f5f7fb;padding:6px 0}.small{font-size:12px}.progress{height:9px;background:#e8ebf2;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#315efb;border-radius:99px}.toast{position:fixed;bottom:18px;left:18px;right:18px;max-width:700px;margin:auto;background:#172033;color:#fff;padding:13px 15px;border-radius:13px;z-index:99;text-align:center}.result{border:1px solid #dfe4ee;border-radius:14px;padding:14px;background:#fafbfe}.dangerText{color:#d63d4a}.okText{color:#12895a}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="toast"></div>
<script>
const SUPABASE_URL='https://eclnddvupggxyythtpkv.supabase.co';
const SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbqK0';
let state={user:null,subject:'اللغة العربية',scopeType:'lesson',scopeName:'',difficulty:'mixed',count:10,type:'mcq',questions:[],answers:{},essayAnswer:'',grading:null,loading:false};
const subjects=['اللغة العربية','اللغة الإنجليزية','اللغة الفرنسية','الرياضيات','الفيزياء','الكيمياء','الأحياء','التاريخ','الجغرافيا'];
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.className='toast';setTimeout(()=>t.className='',2600)}
function render(){document.getElementById('app').innerHTML=`
<div class="topbar"><div class="row between"><strong>رحلة الثانوية</strong><span class="badge">مساعدك الدراسي الذكي</span></div></div>
<div class="card hero"><h1>اختبارات ذكية بالـ AI</h1><div>أنشئ اختبارًا أصليًا حسب المادة والدرس والمستوى، ثم احصل على تصحيح وتحليل.</div></div>
<div class="card"><h3>1) المادة</h3><select id="subject" class="select">${subjects.map(s=>`<option ${s===state.subject?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
<div class="card"><h3>2) نطاق الاختبار</h3><div class="tabs">${[['lesson','درس'],['chapter','وحدة / فصل'],['subject','المادة بالكامل']].map(([v,l])=>`<button class="btn tab ${state.scopeType===v?'active':''}" data-scope="${v}">${l}</button>`).join('')}</div><input id="scopeName" class="input" placeholder="اسم الدرس أو الوحدة" value="${esc(state.scopeName)}" ${state.scopeType==='subject'?'disabled':''} style="margin-top:9px"></div>
<div class="card"><h3>3) نوع الأسئلة</h3><div class="tabs">${[['mcq','اختيار من متعدد'],['essay','مقالي']].map(([v,l])=>`<button class="btn tab ${state.type===v?'active':''}" data-type="${v}">${l}</button>`).join('')}</div></div>
<div class="card"><div class="grid grid2"><div><label class="small">الصعوبة</label><select id="difficulty" class="select"><option value="mixed">متنوع</option><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></div><div><label class="small">عدد الأسئلة</label><select id="count" class="select">${[10,15,20,30].map(n=>`<option ${n===state.count?'selected':''}>${n}</option>`).join('')}</select></div></div><button id="generate" class="btn primary" style="width:100%;margin-top:12px">إنشاء اختبار بالـ AI</button></div>
<div id="quiz"></div>`;bind();}
function bind(){document.getElementById('subject').onchange=e=>state.subject=e.target.value;document.getElementById('scopeName').oninput=e=>state.scopeName=e.target.value;document.getElementById('difficulty').value=state.difficulty;document.getElementById('difficulty').onchange=e=>state.difficulty=e.target.value;document.getElementById('count').onchange=e=>state.count=+e.target.value;document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{state.scopeType=b.dataset.scope;render()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;render()});document.getElementById('generate').onclick=generate;}
async function getToken(){try{const s=localStorage.getItem('supabase.auth.token');if(s){const o=JSON.parse(s);return o.access_token||null}}catch(e){}return null}
async function generate(){if(state.scopeType!=='subject'&&!state.scopeName.trim()){toast('اكتب اسم الدرس أو الوحدة أولاً');return}state.loading=true;document.getElementById('quiz').innerHTML='<div class="card loading">جارٍ إنشاء الاختبار الذكي…</div>';try{const token=await getToken();if(!token)throw new Error('يجب تسجيل الدخول أولاً');const r=await fetch(SUPABASE_URL+'/functions/v1/ai-quiz-v2',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_KEY},body:JSON.stringify({subject:state.subject,scope_type:state.scopeType,scope_name:state.scopeType==='subject'?state.subject:state.scopeName,difficulty:state.difficulty,count:state.count,type:state.type})});const j=await r.json();if(!r.ok)throw new Error(j.error||j.message||'تعذر إنشاء الاختبار');state.questions=j.questions||[];state.answers={};state.grading=null;renderQuiz();}catch(e){toast(e.message)}finally{state.loading=false}}
function renderQuiz(){const q=document.getElementById('quiz');if(!state.questions.length){q.innerHTML='';return}q.innerHTML=`<div class="card"><div class="row between"><h2>الاختبار</h2><span class="badge">${state.questions.length} سؤال</span></div>${state.questions.map((x,i)=>`<div class="question"><b>${i+1}. ${esc(x.question)}</b>${state.type==='mcq'?`<div>${(x.options||[]).map((o,k)=>`<button class="option ${state.answers[i]===k?'selected':''}" data-q="${i}" data-a="${k}">${esc(o)}</button>`).join('')}</div>`:''}</div>`).join('')}${state.type==='essay'?`<textarea id="essay" class="textarea" placeholder="اكتب إجابتك هنا…">${esc(state.essayAnswer)}</textarea><button id="grade" class="btn success" style="width:100%;margin-top:10px">تصحيح الإجابة بالـ AI</button>${state.grading?`<div class="result" style="margin-top:10px"><h3>نتيجة التصحيح: ${esc(state.grading.score)}%</h3><div>${esc(state.grading.feedback||'')}</div>${state.grading.missing_points?`<p><b>نقاط تحتاج مراجعة:</b> ${esc(state.grading.missing_points)}</p>`:''}</div>`:''}`:`<button id="finish" class="btn success" style="width:100%;margin-top:10px">إنهاء وتصحيح الاختبار</button><div id="score"></div>`}</div>`;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{state.answers[+b.dataset.q]=+b.dataset.a;renderQuiz()});const e=document.getElementById('essay');if(e)e.oninput=x=>state.essayAnswer=x.target.value;const g=document.getElementById('grade');if(g)g.onclick=gradeEssay;const f=document.getElementById('finish');if(f)f.onclick=finishMCQ;}
async function finishMCQ(){let correct=0;state.questions.forEach((x,i)=>{if(state.answers[i]===x.answer)correct++});const pct=Math.round(correct/state.questions.length*100);document.getElementById('score').innerHTML=`<div class="result"><h3>نتيجتك ${pct}%</h3><div>الإجابات الصحيحة: ${correct} من ${state.questions.length}</div><div class="progress" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>`;toast('تم تصحيح الاختبار')}
async function gradeEssay(){if(!state.essayAnswer.trim()){toast('اكتب إجابتك أولاً');return}try{const token=await getToken();if(!token)throw new Error('يجب تسجيل الدخول أولاً');const r=await fetch(SUPABASE_URL+'/functions/v1/ai-quiz-v2',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_KEY},body:JSON.stringify({action:'grade_essay',subject:state.subject,question:state.questions[0]?.question||'',answer:state.essayAnswer})});const j=await r.json();if(!r.ok)throw new Error(j.error||'تعذر التصحيح');state.grading=j;renderQuiz()}catch(e){toast(e.message)}}
render();
</script></body></html>
