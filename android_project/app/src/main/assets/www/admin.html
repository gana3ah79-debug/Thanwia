<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة الثانوية - لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#12233f}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #12335a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.input,button{font:inherit}.input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe3ef;border-radius:11px;margin:6px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#246bff;color:#fff;font-weight:800}.secondary{background:#eef4ff;color:#246bff}.danger{background:#ef5261}.hide{display:none}.muted{color:#6e7c91;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #edf0f5}.badge{padding:5px 8px;border-radius:12px;background:#eef4ff;color:#246bff;font-size:11px}</style></head><body><div class="wrap"><section id="login" class="card"><h2>🛠️ لوحة إدارة رحلة الثانوية</h2><p class="muted">تسجيل دخول آمن عبر Supabase Auth</p><input id="email" class="input" type="email" placeholder="البريد الإداري"><input id="password" class="input" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">تسجيل الدخول</button><p id="msg" class="muted"></p></section><main id="app" class="hide"><div class="row"><div><h2>لوحة التحكم 🛠️</h2><span id="who" class="muted"></span></div><button class="btn secondary" onclick="logout()">خروج</button></div><div class="grid"><div class="card"><b>💳 اشتراكات نشطة</b><h2 id="active">-</h2></div><div class="card"><b>🧾 طلبات معلقة</b><h2 id="pending">-</h2></div><div class="card"><b>💰 المقبول</b><h2 id="revenue">-</h2></div></div><section class="card"><h3>💰 الخطط والأسعار</h3><div id="plans"></div><div class="grid"><input id="pn" class="input" placeholder="اسم الخطة"><input id="pp" class="input" type="number" placeholder="السعر بالجنيه"><input id="pd" class="input" type="number" value="30" placeholder="الأيام"></div><button class="btn" onclick="addPlan()">إضافة خطة</button></section><section class="card"><h3>📲 وسائل الدفع</h3><div id="methods"></div><div class="grid"><input id="mn" class="input" placeholder="اسم الوسيلة"><input id="ml" class="input" placeholder="اسم الحساب"><input id="mv" class="input" placeholder="رقم الحساب"><input id="mi" class="input" placeholder="تعليمات"></div><button class="btn" onclick="addMethod()">إضافة وسيلة</button></section><section class="card"><h3>🧾 طلبات الدفع</h3><div id="requests">جارٍ التحميل...</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://eclnddvupggxyythtpkv.supabase.co',KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);async function login(){const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('msg').textContent=error.message;return}boot()}async function boot(){const{data:{user}}=await db.auth.getUser();if(!user)return;const{data:a}=await db.from('admin_users').select('is_active').eq('user_id',user.id).maybeSingle();if(!a?.is_active){$('msg').textContent='هذا الحساب ليس مديرًا.';await db.auth.signOut();return}$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=user.email;load()}async function logout(){await db.auth.signOut();location.reload()}async function load(){const[p,m,r,s]=await Promise.all([db.from('subscription_plans').select('*').order('price'),db.from('payment_methods').select('*').order('id'),db.from('payment_requests').select('*,subscription_plans(name)').order('created_at',{ascending:false}),db.from('student_subscriptions').select('status,expires_at')]);const plans=p.data||[],methods=m.data||[],req=r.data||[],subs=s.data||[];$('active').textContent=subs.filter(x=>x.status==='active'&&(!x.expires_at||new Date(x.expires_at)>new Date())).length;$('pending').textContent=req.filter(x=>x.status==='pending').length;$('revenue').textContent=req.filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.amount||0),0)+' جنيه';$('plans').innerHTML=plans.map(x=>`<div class="row"><span><b>${x.name}</b> · ${x.price} جنيه · ${x.duration_days} يوم</span><button class="btn secondary" onclick="togglePlan(${x.id},${x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div>`).join('')||'لا توجد خطط';$('methods').innerHTML=methods.map(x=>`<div class="row"><span><b>${x.name}</b> · ${x.account_value||''}</span><button class="btn secondary" onclick="toggleMethod(${x.id},${x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div>`).join('')||'لا توجد وسائل';$('requests').innerHTML=req.length?req.map(x=>`<div class="row"><span>${x.subscription_plans?.name||'خطة'} · ${x.amount||0} جنيه · <span class="badge">${x.status}</span></span>${x.status==='pending'?`<span><button class="btn" onclick="approve(${x.id},${x.user_id},${x.plan_id})">قبول</button> <button class="btn danger" onclick="reject(${x.id})">رفض</button></span>`:''}</div>`).join(''):'لا توجد طلبات'}async function addPlan(){await db.from('subscription_plans').insert({name:$('pn').value.trim(),price:Number($('pp').value),duration_days:Number($('pd').value)||30,is_active:true});load()}async function togglePlan(id,v){await db.from('subscription_plans').update({is_active:!v}).eq('id',id);load()}async function addMethod(){await db.from('payment_methods').insert({name:$('mn').value.trim(),account_label:$('ml').value.trim(),account_value:$('mv').value.trim(),instructions:$('mi').value.trim(),is_active:true});load()}async function toggleMethod(id,v){await db.from('payment_methods').update({is_active:!v}).eq('id',id);load()}async function approve(id,uid,pid){const{data:p}=await db.from('subscription_plans').select('*').eq('id',pid).single(),{data:{user}}=await db.auth.getUser(),now=new Date(),exp=new Date(now.getTime()+(p?.duration_days||30)*86400000).toISOString();await db.from('payment_requests').update({status:'approved',reviewed_by:user.id,reviewed_at:now.toISOString()}).eq('id',id);await db.from('student_subscriptions').upsert({user_id:uid,plan_id:pid,status:'active',started_at:now.toISOString(),expires_at:exp,approved_by:user.id,approved_at:now.toISOString(),updated_at:now.toISOString()},{onConflict:'user_id'});load()}async function reject(id){const{data:{user}}=await db.auth.getUser();await db.from('payment_requests').update({status:'rejected',reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);load()}boot()</script></body></html>
