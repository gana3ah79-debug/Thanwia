<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة الثانوية - لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#12233f}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #12335a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.input,button{font:inherit}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dbe3ef;border-radius:12px;margin:6px 0;background:#fff}.btn{border:0;border-radius:13px;padding:12px 16px;background:#246bff;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.secondary{background:#eef4ff;color:#246bff}.danger{background:#ef5261}.hide{display:none}.muted{color:#6e7c91;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.badge{padding:5px 8px;border-radius:12px;background:#eef4ff;color:#246bff;font-size:11px}.error{color:#c62828;background:#fff1f1;border-radius:12px;padding:10px;margin-top:8px}.ok{color:#176b3a;background:#effaf3;border-radius:12px;padding:10px;margin-top:8px}.status{margin:8px 0;padding:9px 11px;border-radius:12px;background:#f7f9fc;color:#6e7c91;font-size:12px}.method-on{background:#eaf9f2;color:#16845a}.method-off{background:#f2f3f5;color:#777}.req{background:#fffdf7;border-radius:14px;padding:10px;margin:8px 0;border:1px solid #eee5c9}</style></head><body><div class="wrap"><section id="login" class="card"><h2>🛠️ لوحة إدارة رحلة الثانوية</h2><p class="muted">تسجيل دخول آمن عبر Supabase Auth</p><input id="email" class="input" type="email" autocomplete="username" placeholder="البريد الإداري"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginBtn" class="btn" onclick="login()">تسجيل الدخول</button><p id="msg" class="muted"></p></section><main id="app" class="hide"><div class="row"><div><h2>لوحة التحكم 🛠️</h2><span id="who" class="muted"></span></div><button class="btn secondary" onclick="logout()">خروج</button></div><div class="grid"><div class="card"><b>💳 اشتراكات نشطة</b><h2 id="active">-</h2></div><div class="card"><b>🧾 طلبات معلقة</b><h2 id="pending">-</h2></div><div class="card"><b>💰 المقبول</b><h2 id="revenue">-</h2></div></div><section class="card"><h3>💰 الخطط والأسعار</h3><div id="plans" class="status">جارٍ التحميل...</div><div class="grid"><input id="pn" class="input" placeholder="اسم الخطة"><input id="pp" class="input" type="number" placeholder="السعر بالجنيه"><input id="pd" class="input" type="number" value="30" placeholder="الأيام"></div><button class="btn" onclick="addPlan()">إضافة خطة</button></section><section class="card"><h3>📲 وسائل الدفع</h3><p class="muted">فعّل الوسيلة لتظهر للطلاب، أو عطّلها لإخفائها.</p><div id="methods" class="status">جارٍ التحميل...</div><div class="grid"><input id="mn" class="input" placeholder="اسم الوسيلة"><input id="ml" class="input" placeholder="اسم الحساب"><input id="mv" class="input" placeholder="رقم الحساب"><input id="mi" class="input" placeholder="تعليمات"></div><button class="btn" onclick="addMethod()">إضافة وسيلة</button></section><section class="card"><h3>🧾 طلبات الدفع</h3><div id="requests" class="status">جارٍ التحميل...</div></section></main></div><script>
const API='https://eclnddvupggxyythtpkv.supabase.co',KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0';let token=sessionStorage.getItem('admin_access_token'),uid=sessionStorage.getItem('admin_user_id');const $=x=>document.getElementById(x);
function msg(t,ok=false){$('msg').className=ok?'ok':'error';$('msg').textContent=t}
async function auth(path,body){const r=await fetch(API+'/auth/v1/'+path,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'فشل تسجيل الدخول');return d}
async function api(path,opts={}){const h=Object.assign({'apikey':KEY,'Authorization':'Bearer '+token,'Accept':'application/json'},opts.headers||{});const o=Object.assign({},opts,{headers:h});if(o.body&&typeof o.body!=='string'){h['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(API+'/rest/v1/'+path,o);const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(d?.message||d?.hint||text||('HTTP '+r.status));return d}
async function login(){const b=$('loginBtn');b.disabled=true;msg('جارٍ التحقق...');try{const d=await auth('token?grant_type=password',{email:$('email').value.trim(),password:$('password').value});token=d.access_token;uid=d.user?.id||'';sessionStorage.setItem('admin_access_token',token);sessionStorage.setItem('admin_user_id',uid);const a=await api('admin_users?select=is_active&user_id=eq.'+encodeURIComponent(uid));if(!a?.[0]?.is_active)throw new Error('تم تسجيل الدخول لكن هذا الحساب ليس مديرًا نشطًا.');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=d.user.email;await load()}catch(e){token=null;uid=null;sessionStorage.removeItem('admin_access_token');sessionStorage.removeItem('admin_user_id');msg(e.message||'حدث خطأ أثناء تسجيل الدخول')}finally{b.disabled=false}}
async function boot(){if(!token||!uid)return;try{const u=await fetch(API+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+token}});if(!u.ok)throw new Error();const d=await u.json();const a=await api('admin_users?select=is_active&user_id=eq.'+encodeURIComponent(d.id));if(!a?.[0]?.is_active)throw new Error();$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=d.email;await load()}catch{sessionStorage.clear();token=null;uid=null}}
async function logout(){if(token)fetch(API+'/auth/v1/logout',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+token}}).catch(()=>{});sessionStorage.clear();location.reload()}
function renderError(id,e){$(id).innerHTML='<div class="error">تعذر تحميل هذا القسم: '+esc(e?.message||e)+'</div>'}
async function loadPlans(){try{const plans=await api('subscription_plans?select=*&order=price.asc');$('plans').className='';$('plans').innerHTML=(plans||[]).map(x=>`<div class="row"><span><b>${esc(x.name)}</b> · ${x.price} جنيه · ${x.duration_days} يوم</span><button class="btn secondary" onclick="togglePlan(${x.id},${!!x.is_active})">${x.is_active?'إخفاء':'إظهار'}</button></div>`).join('')||'<div class="muted">لا توجد خطط.</div>'}catch(e){renderError('plans',e)}}
async function loadMethods(){try{const methods=await api('payment_methods?select=*&order=id.asc');$('methods').className='';$('methods').innerHTML=(methods||[]).map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><small>${esc(x.account_value||'')}</small></span><button class="btn ${x.is_active?'secondary':'danger'}" onclick="toggleMethod(${x.id},${!!x.is_active})">${x.is_active?'🟢 ظاهر للطلاب — إخفاء':'🔴 مخفي — إظهار'}</button></div>`).join('')||'<div class="muted">لا توجد وسائل دفع. أضف أول وسيلة بالأسفل.</div>'}catch(e){renderError('methods',e)}}
async function loadRequests(){try{const req=await api('payment_requests?select=*&order=created_at.desc');$('requests').className='';$('requests').innerHTML=(req||[]).length?(req||[]).map(x=>`<div class="req"><div><b>${esc(x.method||'وسيلة دفع')}</b> · ${x.amount||0} جنيه</div><div class="muted">المرجع: ${esc(x.reference||'—')} · الحالة: <span class="badge">${esc(x.status)}</span></div>${x.status==='pending'?`<div style="margin-top:8px"><button class="btn" onclick="approve(${x.id},'${x.user_id}',${x.plan_id})">قبول</button> <button class="btn danger" onclick="reject(${x.id})">رفض</button></div>`:''}</div>`).join(''):'<div class="muted">لا توجد طلبات دفع.</div>'}catch(e){renderError('requests',e)}}
async function loadStats(){try{const [subs,req]=await Promise.all([api('student_subscriptions?select=status,expires_at'),api('payment_requests?select=status,amount')]);$('active').textContent=(subs||[]).filter(x=>x.status==='active'&&(!x.expires_at||new Date(x.expires_at)>new Date())).length;$('pending').textContent=(req||[]).filter(x=>x.status==='pending').length;$('revenue').textContent=(req||[]).filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.amount||0),0)+' جنيه'}catch(e){$('active').textContent='—';$('pending').textContent='—';$('revenue').textContent='—'}}
async function load(){loadPlans();loadMethods();loadRequests();loadStats()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function addPlan(){try{const name=$('pn').value.trim(),price=Number($('pp').value),days=Number($('pd').value)||30;if(!name||!price)throw new Error('اكتب اسم الخطة والسعر.');await api('subscription_plans',{method:'POST',headers:{'Prefer':'return=minimal'},body:{name,price,duration_days:days,is_active:true}});$('pn').value='';$('pp').value='';await loadPlans()}catch(e){alert(e.message)}}
async function togglePlan(id,v){try{await api('subscription_plans?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{is_active:!v}});await loadPlans()}catch(e){alert(e.message)}}
async function addMethod(){try{const name=$('mn').value.trim();if(!name)throw new Error('اكتب اسم وسيلة الدفع.');await api('payment_methods',{method:'POST',headers:{'Prefer':'return=minimal'},body:{name,account_label:$('ml').value.trim(),account_value:$('mv').value.trim(),instructions:$('mi').value.trim(),is_active:true}});$('mn').value='';$('ml').value='';$('mv').value='';$('mi').value='';await loadMethods()}catch(e){alert(e.message)}}
async function toggleMethod(id,v){try{await api('payment_methods?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{is_active:!v}});await loadMethods()}catch(e){alert(e.message)}}
async function approve(id,userId,planId){try{const p=(await api('subscription_plans?id=eq.'+planId+'&select=*'))?.[0];if(!p)throw new Error('الخطة غير موجودة');const now=new Date(),exp=new Date(now.getTime()+(p.duration_days||30)*86400000).toISOString();await api('payment_requests?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{status:'approved',reviewed_by:uid,reviewed_at:now.toISOString()}});await api('student_subscriptions?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:userId,plan_id:planId,status:'active',started_at:now.toISOString(),expires_at:exp,approved_by:uid,approved_at:now.toISOString(),updated_at:now.toISOString()}});await load()}catch(e){alert(e.message)}}
async function reject(id){try{await api('payment_requests?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{status:'rejected',reviewed_by:uid,reviewed_at:new Date().toISOString()}});await load()}catch(e){alert(e.message)}}
boot();
</script></body></html>
