<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة الثانوية - لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#12233f}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #12335a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.input,button{font:inherit}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dbe3ef;border-radius:12px;margin:6px 0;background:#fff}.btn{border:0;border-radius:13px;padding:12px 16px;background:#246bff;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.secondary{background:#eef4ff;color:#246bff}.danger{background:#ef5261}.hide{display:none}.muted{color:#6e7c91;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f5}.badge{padding:5px 8px;border-radius:12px;background:#eef4ff;color:#246bff;font-size:11px}.error{color:#c62828;background:#fff1f1;border-radius:12px;padding:10px;margin-top:8px}.ok{color:#176b3a;background:#effaf3;border-radius:12px;padding:10px;margin-top:8px}</style></head><body><div class="wrap"><section id="login" class="card"><h2>🛠️ لوحة إدارة رحلة الثانوية</h2><p class="muted">تسجيل دخول آمن عبر Supabase Auth</p><input id="email" class="input" type="email" autocomplete="username" placeholder="البريد الإداري"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginBtn" class="btn" onclick="login()">تسجيل الدخول</button><p id="msg" class="muted"></p></section><main id="app" class="hide"><div class="row"><div><h2>لوحة التحكم 🛠️</h2><span id="who" class="muted"></span></div><button class="btn secondary" onclick="logout()">خروج</button></div><div class="grid"><div class="card"><b>💳 اشتراكات نشطة</b><h2 id="active">-</h2></div><div class="card"><b>🧾 طلبات معلقة</b><h2 id="pending">-</h2></div><div class="card"><b>💰 المقبول</b><h2 id="revenue">-</h2></div></div><section class="card"><h3>💰 الخطط والأسعار</h3><div id="plans">جارٍ التحميل...</div><div class="grid"><input id="pn" class="input" placeholder="اسم الخطة"><input id="pp" class="input" type="number" placeholder="السعر بالجنيه"><input id="pd" class="input" type="number" value="30" placeholder="الأيام"></div><button class="btn" onclick="addPlan()">إضافة خطة</button></section><section class="card"><h3>📲 وسائل الدفع</h3><div id="methods">جارٍ التحميل...</div><div class="grid"><input id="mn" class="input" placeholder="اسم الوسيلة"><input id="ml" class="input" placeholder="اسم الحساب"><input id="mv" class="input" placeholder="رقم الحساب"><input id="mi" class="input" placeholder="تعليمات"></div><button class="btn" onclick="addMethod()">إضافة وسيلة</button></section><section class="card"><h3>🧾 طلبات الدفع</h3><div id="requests">جارٍ التحميل...</div></section></main></div><script>
const API='https://eclnddvupggxyythtpkv.supabase.co',KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0';let token=sessionStorage.getItem('admin_access_token'),uid=sessionStorage.getItem('admin_user_id');const $=x=>document.getElementById(x);
function msg(t,ok=false){$('msg').className=ok?'ok':'error';$('msg').textContent=t}
async function auth(path,body){const r=await fetch(API+'/auth/v1/'+path,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'فشل تسجيل الدخول');return d}
async function api(path,opts={}){const h=Object.assign({'apikey':KEY,'Authorization':'Bearer '+token},opts.headers||{});if(opts.body&&typeof opts.body!=='string'){h['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}const r=await fetch(API+'/rest/v1/'+path,Object.assign({},opts,{headers:h}));const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(d?.message||d?.hint||text||('HTTP '+r.status));return d}
async function login(){const b=$('loginBtn');b.disabled=true;msg('جارٍ التحقق...');try{const d=await auth('token?grant_type=password',{email:$('email').value.trim(),password:$('password').value});token=d.access_token;uid=d.user?.id||'';sessionStorage.setItem('admin_access_token',token);sessionStorage.setItem('admin_user_id',uid);const a=await api('admin_users?select=is_active&user_id=eq.'+encodeURIComponent(uid));if(!a?.[0]?.is_active)throw new Error('تم تسجيل الدخول لكن هذا الحساب ليس مديرًا نشطًا.');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=d.user.email;await load()}catch(e){token=null;uid=null;sessionStorage.removeItem('admin_access_token');sessionStorage.removeItem('admin_user_id');msg(e.message||'حدث خطأ أثناء تسجيل الدخول')}finally{b.disabled=false}}
async function boot(){if(!token||!uid)return;try{const u=await fetch(API+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+token}});if(!u.ok)throw new Error();const d=await u.json();const a=await api('admin_users?select=is_active&user_id=eq.'+encodeURIComponent(d.id));if(!a?.[0]?.is_active)throw new Error();$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=d.email;await load()}catch{sessionStorage.clear();token=null;uid=null}}
async function logout(){if(token)fetch(API+'/auth/v1/logout',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+token}}).catch(()=>{});sessionStorage.clear();location.reload()}
async function load(){try{const [plans,methods,req,subs]=await Promise.all([api('subscription_plans?select=*&order=price.asc'),api('payment_methods?select=*&order=id.asc'),api('payment_requests?select=*,subscription_plans(name)&order=created_at.desc'),api('student_subscriptions?select=status,expires_at')]);$('active').textContent=(subs||[]).filter(x=>x.status==='active'&&(!x.expires_at||new Date(x.expires_at)>new Date())).length;$('pending').textContent=(req||[]).filter(x=>x.status==='pending').length;$('revenue').textContent=(req||[]).filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.amount||0),0)+' جنيه';$('plans').innerHTML=(plans||[]).map(x=>`<div class="row"><span><b>${esc(x.name)}</b> · ${x.price} جنيه · ${x.duration_days} يوم</span><button class="btn secondary" onclick="togglePlan(${x.id},${x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div>`).join('')||'لا توجد خطط';$('methods').innerHTML=(methods||[]).map(x=>`<div class="row"><span><b>${esc(x.name)}</b> · ${esc(x.account_value||'')}</span><button class="btn secondary" onclick="toggleMethod(${x.id},${x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div>`).join('')||'لا توجد وسائل';$('requests').innerHTML=(req||[]).length?(req||[]).map(x=>`<div class="row"><span>${esc(x.subscription_plans?.name||'خطة')} · ${x.amount||0} جنيه · <span class="badge">${esc(x.status)}</span></span>${x.status==='pending'?`<span><button class="btn" onclick="approve(${x.id},'${x.user_id}',${x.plan_id})">قبول</button> <button class="btn danger" onclick="reject(${x.id})">رفض</button></span>`:''}</div>`).join(''):'لا توجد طلبات'}catch(e){msg(e.message||'تعذر تحميل البيانات')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function addPlan(){try{await api('subscription_plans',{method:'POST',headers:{'Prefer':'return=minimal'},body:{name:$('pn').value.trim(),price:Number($('pp').value),duration_days:Number($('pd').value)||30,is_active:true}});await load()}catch(e){msg(e.message)}}
async function togglePlan(id,v){try{await api('subscription_plans?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{is_active:!v}});await load()}catch(e){msg(e.message)}}
async function addMethod(){try{await api('payment_methods',{method:'POST',headers:{'Prefer':'return=minimal'},body:{name:$('mn').value.trim(),account_label:$('ml').value.trim(),account_value:$('mv').value.trim(),instructions:$('mi').value.trim(),is_active:true}});await load()}catch(e){msg(e.message)}}
async function toggleMethod(id,v){try{await api('payment_methods?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{is_active:!v}});await load()}catch(e){msg(e.message)}}
async function approve(id,userId,planId){try{const p=(await api('subscription_plans?id=eq.'+planId+'&select=*'))?.[0];if(!p)throw new Error('الخطة غير موجودة');const now=new Date(),exp=new Date(now.getTime()+(p.duration_days||30)*86400000).toISOString();await api('payment_requests?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{status:'approved',reviewed_by:uid,reviewed_at:now.toISOString()}});await api('student_subscriptions?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:{user_id:userId,plan_id:planId,status:'active',started_at:now.toISOString(),expires_at:exp,approved_by:uid,approved_at:now.toISOString(),updated_at:now.toISOString()}});await load()}catch(e){msg(e.message)}}
async function reject(id){try{await api('payment_requests?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:{status:'rejected',reviewed_by:uid,reviewed_at:new Date().toISOString()}});await load()}catch(e){msg(e.message)}}
boot();
</script></body></html>
