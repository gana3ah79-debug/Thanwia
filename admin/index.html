<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة الثانوية — لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#12233f}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 10px 30px rgba(20,50,90,.09)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.input,button{font:inherit}.input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe3ef;border-radius:12px;margin:6px 0}.btn{border:0;border-radius:13px;padding:12px 16px;background:#246bff;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eef4ff;color:#246bff}.danger{background:#ef5261}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#6e7c91;font-size:13px}.hide{display:none}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #edf0f5;text-align:right}.badge{padding:6px 9px;border-radius:15px;background:#eef4ff;color:#246bff;font-size:11px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#102a4b;color:#fff;padding:10px 15px;border-radius:20px;display:none}.toast.show{display:block}</style></head><body><div class="wrap"><div id="login" class="card"><h1>🛠️ لوحة إدارة رحلة الثانوية</h1><p class="muted">الدخول يتم عبر Supabase Auth. بيانات المدير لا يتم تضمينها داخل APK.</p><input id="email" class="input" type="email" placeholder="البريد الإداري"><input id="password" class="input" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">تسجيل الدخول</button><div id="msg" class="muted"></div></div><main id="app" class="hide"><div class="row"><div><h1>لوحة التحكم 🛠️</h1><div id="who" class="muted"></div></div><button class="btn secondary" onclick="logout()">خروج</button></div><div class="grid"><div class="card"><b>👥 الطلاب</b><h2 id="students">—</h2></div><div class="card"><b>💳 اشتراكات نشطة</b><h2 id="activeSubs">—</h2></div><div class="card"><b>🧾 طلبات دفع معلقة</b><h2 id="pending">—</h2></div><div class="card"><b>💰 إجمالي الطلبات المقبولة</b><h2 id="revenue">—</h2></div></div><section class="card"><h2>💰 الخطط والأسعار</h2><div id="plans"></div><div class="grid"><input id="planName" class="input" placeholder="اسم الخطة"><input id="planPrice" class="input" type="number" placeholder="السعر بالجنيه"><input id="planDays" class="input" type="number" value="30" placeholder="عدد الأيام"></div><button class="btn" onclick="addPlan()">إضافة خطة</button></section><section class="card"><h2>📲 وسائل الدفع</h2><div id="methods"></div><div class="grid"><input id="methodName" class="input" placeholder="المحفظة / InstaPay"><input id="methodLabel" class="input" placeholder="اسم الحساب"><input id="methodValue" class="input" placeholder="رقم المحفظة أو الحساب"><input id="methodInfo" class="input" placeholder="تعليمات الدفع"></div><button class="btn" onclick="addMethod()">إضافة وسيلة</button></section><section class="card"><h2>🧾 طلبات الدفع</h2><div id="requests"></div></section><section class="card"><h2>📊 إحصائيات</h2><div id="stats" class="muted">جارٍ التحميل...</div></section></main></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://eclnddvupggxyythtpkv.supabase.co',KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0',db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}async function login(){const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('msg').textContent=error.message;return}await boot()}async function boot(){const {data:{user}}=await db.auth.getUser();if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');return}const {data:admin}=await db.from('admin_users').select('*').eq('user_id',user.id).maybeSingle();if(!admin?.is_active){$('msg').textContent='هذا الحساب ليس لديه صلاحية مدير.';await db.auth.signOut();return}$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=user.email;await loadAll()}async function logout(){await db.auth.signOut();location.reload()}async function loadAll(){const [p,m,r,s]=await Promise.all([db.from('subscription_plans').select('*').order('price'),db.from('payment_methods').select('*').order('id'),db.from('payment_requests').select('*,subscription_plans(name),payment_methods(name)').order('created_at',{ascending:false}),db.from('student_subscriptions').select('status,expires_at')]);$('plans').innerHTML=(p.data||[]).map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #edf0f5"><span><b>${x.name}</b> · ${x.price} جنيه · ${x.duration_days} يوم</span><button class="btn secondary" onclick="togglePlan(${x.id},${x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div>`).join('');$('methods').innerHTML=(m.data||[]).map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #edf0f5"><span><b>${x.name}</b> · ${x.account_value}</span><button class="btn secondary" onclick="toggleMethod(${x.id},${x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div>`).join('');const req=r.data||[];$('requests').innerHTML=req.length?'<table class="table"><tr><th>الخطة</th><th>المبلغ</th><th>المرجع</th><th>الحالة</th><th></th></tr>'+req.map(x=>`<tr><td>${x.subscription_plans?.name||'—'}</td><td>${x.amount}</td><td>${x.reference||'—'}</td><td><span class="badge">${x.status}</span></td><td>${x.status==='pending'?`<button class="btn" onclick="approve(${x.id},${x.user_id?`'${x.user_id}'`:'null'},${x.plan_id})">قبول</button> <button class="btn danger" onclick="reject(${x.id})">رفض</button>`:'—'}</td></tr>`).join('')+'</table>':'لا توجد طلبات.';const subs=s.data||[];$('students').textContent='حسابات الطلاب عبر Auth';$('activeSubs').textContent=subs.filter(x=>x.status==='active'&&(!x.expires_at||new Date(x.expires_at)>new Date())).length;$('pending').textContent=req.filter(x=>x.status==='pending').length;$('revenue').textContent=req.filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.amount||0),0)+' جنيه';$('stats').textContent=`إجمالي الاشتراكات المسجلة: ${subs.length} · النشطة: ${$('activeSubs').textContent} · الطلبات: ${req.length}`}
async function addPlan(){const {error}=await db.from('subscription_plans').insert({name:$('planName').value.trim(),price:Number($('planPrice').value),duration_days:Number($('planDays').value)||30,is_active:true});toast(error?'تعذر الإضافة':'تمت إضافة الخطة');await loadAll()}async function togglePlan(id,v){await db.from('subscription_plans').update({is_active:!v,updated_at:new Date().toISOString()}).eq('id',id);await loadAll()}async function addMethod(){const {error}=await db.from('payment_methods').insert({name:$('methodName').value.trim(),account_label:$('methodLabel').value.trim(),account_value:$('methodValue').value.trim(),instructions:$('methodInfo').value.trim(),is_active:true});toast(error?'تعذر الإضافة':'تمت إضافة وسيلة الدفع');await loadAll()}async function toggleMethod(id,v){await db.from('payment_methods').update({is_active:!v}).eq('id',id);await loadAll()}async function approve(id,userId,planId){const {data:p}=await db.from('subscription_plans').select('*').eq('id',planId).single();const exp=new Date(Date.now()+(p?.duration_days||30)*86400000).toISOString();const {data:{user}}=await db.auth.getUser();await db.from('payment_requests').update({status:'approved',reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);await db.from('student_subscriptions').upsert({user_id:userId,plan_id:planId,status:'active',started_at:new Date().toISOString(),expires_at:exp,approved_by:user.id,approved_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id'});toast('تم تفعيل الاشتراك');await loadAll()}async function reject(id){const {data:{user}}=await db.auth.getUser();await db.from('payment_requests').update({status:'rejected',reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);await loadAll()}boot();</script></body></html>
