name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and fix Supabase publishable key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          correct = 'sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          # Replace any embedded publishable key in the source with the known-good key.
          s2 = re.sub(r"sb_publishable_[A-Za-z0-9_-]+", correct, s)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              s = s2
          if correct not in s:
              raise SystemExit('ERROR: Supabase publishable key was not fixed in source')
          print('Supabase key verified')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Verify key inside built APK
        shell: bash
        run: |
          unzip -p android_project/app/build/outputs/apk/debug/app-debug.apk assets/www/index.html > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          current='sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          if "SUPABASE_KEY='"+current+"'" not in s:
              raise SystemExit('ERROR: built APK contains the wrong Supabase key')
          print('APK Supabase key verification passed')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-final-fixed-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk

# Manual build trigger: this comment intentionally starts the APK workflow on main.
