name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force verified Supabase auth key and remove legacy color picker from APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          correct = 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s2 = re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='" + correct + "'", s)
          if s2 == s and correct not in s:
              raise SystemExit('ERROR: SUPABASE_KEY assignment was not found')
          s = s2
          guard = '<style id="rihla-no-color-picker">#rihla-theme-entry,#rihla-theme-picker,#rihla-theme-toast,.theme-options,.theme-title,.theme-sub{display:none!important}</style>'
          if 'rihla-no-color-picker' not in s:
              s = s.replace('</head>', guard + '</head>', 1)
          guard_js = '''<script id="rihla-auth-final-guard">\n(function(){\n  function clean(){['rihla-theme-entry','rihla-theme-picker','rihla-theme-toast'].forEach(function(id){var e=document.getElementById(id);if(e)e.remove();});}\n  clean();\n  new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true});\n})();\n</script>'''
          if 'rihla-auth-final-guard' not in s:
              s = s.replace('</body>', guard_js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          if "SUPABASE_KEY='" + correct + "'" not in s:
              raise SystemExit('ERROR: final auth key is not correct')
          print('Verified Supabase publishable key applied and legacy color picker disabled')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Verify exact Supabase key inside built APK
        shell: bash
        run: |
          unzip -p android_project/app/build/outputs/apk/debug/app-debug.apk assets/www/index.html > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          current='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          if "SUPABASE_KEY='"+current+"'" not in s:
              raise SystemExit('ERROR: built APK contains the wrong Supabase key')
          if 'rihla-no-color-picker' not in s:
              raise SystemExit('ERROR: color-picker guard missing from built APK')
          print('APK Supabase key and color-picker guard verification passed')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-final-fixed-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
