name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V8 source
        run: |
          set -e
          KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          grep -q "$KEY" android_project/app/src/main/assets/www/app-core-v8.js
          grep -q 'rihlaCoreV8' android_project/app/src/main/assets/www/app-core-v8.js
          grep -q 'rihlaLogoutV8' android_project/app/src/main/assets/www/app-core-v8.js
          grep -q 'app-core-v8.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v7.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-stability-v4.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
      - name: Normalize legacy Supabase key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          bad='sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          good='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s=s.replace(bad,good)
          p.write_text(s,encoding='utf-8')
          assert bad not in s and good in s
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project
      - name: Verify APK
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/app-core-v8.js | grep -q 'rihlaLogoutV8'
          unzip -p "$APK" assets/www/app-core-v8.js | grep -q 'window.show=function(id)'
          unzip -p "$APK" assets/www/index.html | grep -q 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
      - uses: actions/upload-artifact@v4
        with:
          name: Thanwia-Final-V8-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
