name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply full final app configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          current = 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s = re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='" + current + "'", s, count=1)
          tags = ['<script src="final-features.js"></script>','<script src="payment-methods.js"></script>','<script src="admin-entry.js"></script>','<script src="ui-fixes.js"></script>']
          for tag in tags:
              if tag not in s: s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          assert "SUPABASE_KEY='" + current + "'" in s
          for tag in tags: assert tag in s
          print('Full final app configuration verified')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Full APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Verify Full APK
        shell: bash
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html > /tmp/index.html
          grep -F "SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'" /tmp/index.html
          grep -F 'final-features.js' /tmp/index.html
          grep -F 'payment-methods.js' /tmp/index.html
          grep -F 'admin-entry.js' /tmp/index.html
          grep -F 'ui-fixes.js' /tmp/index.html
          unzip -l "$APK" | grep 'assets/www/admin-entry.js'
          unzip -l "$APK" | grep 'assets/www/admin.html'
          unzip -l "$APK" | grep 'assets/www/payment-methods.js'
          unzip -l "$APK" | grep 'assets/www/ui-fixes.js'
          unzip -p "$APK" assets/www/admin-entry.js | grep -F 'file:///android_asset/www/admin.html'
          echo 'FULL FINAL APK VERIFIED WITH LOCAL ADMIN PANEL, PAYMENT METHOD SELECTOR, AND LOGIN UI FIXES'

      - name: Upload Full Final APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-full-final-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
