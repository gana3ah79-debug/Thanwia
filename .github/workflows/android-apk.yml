name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final auth UI and verified Supabase configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')

          # Active publishable key currently enabled in the Supabase project.
          key = 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s = re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='" + key + "'", s)

          # Remove the legacy theme picker source completely.
          s = re.sub(r'\n<script id="rihla-color-themes-js">.*?</script>', '', s, flags=re.S)

          # Remove the layout/density picker that was appearing beside the auth form.
          s = re.sub(r'\n  function addLayoutPicker\(\)\{.*?\n  \}\n  function responsive', '\n  function responsive', s, flags=re.S)
          s = s.replace('addLayoutPicker();', '').replace('setTimeout(addLayoutPicker,1200);', '')
          s = re.sub(r'<script id="rihla-auth-final-guard">.*?</script>', '', s, flags=re.S)

          # Keep the auth UI guard only for any legacy elements injected by older code.
          guard_js = '''<script id="rihla-auth-final-guard">(function(){function clean(){['rihla-theme-entry','rihla-theme-picker','rihla-theme-toast','rihla-layout-picker'].forEach(function(id){var e=document.getElementById(id);if(e)e.remove()});document.querySelectorAll('.theme-options,.theme-title,.theme-sub,.rihla-layout-bar,.rihla-layout-chip').forEach(function(e){e.remove()})}clean();new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true})})();</script>'''
          s = s.replace('</body>', guard_js + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          required=[key,'auth-v2','authResetPassword','rihla-auth-final-guard','تغيير كلمة المرور']
          for x in required:
              if x not in s: raise SystemExit('ERROR missing final marker: '+x)
          if 'rihla-color-themes-js' in s or 'rihla-layout-picker' in s or 'function addLayoutPicker' in s:
              raise SystemExit('ERROR: legacy layout/theme picker still present')
          print('FINAL AUTH + CORRECT ACTIVE SUPABASE KEY + NO THEME/LAYOUT PICKERS')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Verify final APK is the new build
        shell: bash
        run: |
          unzip -p android_project/app/build/outputs/apk/debug/app-debug.apk assets/www/index.html > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          required=['sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0','auth-v2','authResetPassword','rihla-auth-final-guard','تغيير كلمة المرور']
          for x in required:
              if x not in s: raise SystemExit('ERROR: missing APK marker: '+x)
          if 'rihla-color-themes-js' in s or 'rihla-layout-picker' in s or 'function addLayoutPicker' in s:
              raise SystemExit('ERROR: theme/layout picker still in APK')
          if 'auth-box-v2' not in s or 'دخول آمن' not in s: raise SystemExit('ERROR: old auth UI still present')
          print('NEW APK VERIFIED: correct active key + auth-v2 + password reset + no theme/layout controls')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-AUTH-V6-final
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
