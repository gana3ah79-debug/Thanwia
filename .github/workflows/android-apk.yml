name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete interface
        run: unzip -o .build/payload.zip -d android_project/app/src/main/assets/www

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
