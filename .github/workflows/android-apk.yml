name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source configuration
        shell: bash
        run: |
          set -e
          KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          test -f android_project/app/src/main/assets/www/app-stability-v4.js
          grep -q 'rihlaStabilityV4' android_project/app/src/main/assets/www/app-stability-v4.js
          grep -q 'rihlaLogout' android_project/app/src/main/assets/www/app-stability-v4.js
          grep -q "$KEY" android_project/app/src/main/assets/www/auth-fix-v2.js
          grep -q "$KEY" android_project/app/src/main/assets/www/admin-access-v2.js
          grep -q "$KEY" android_project/app/src/main/assets/www/subscription-v2.js
          grep -q 'app-stability-v4.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          grep -q 'rihlaBack' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
      - name: Normalize legacy Supabase key at build time
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          bad='sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          good='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          if bad in s:
              s=s.replace(bad,good)
              p.write_text(s,encoding='utf-8')
          assert bad not in s
          assert good in s
          print('Supabase key normalized')
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/app-stability-v4.js | grep -q 'rihlaStabilityV4'
          unzip -p "$APK" assets/www/app-stability-v4.js | grep -q 'rihlaLogout'
          unzip -p "$APK" assets/www/index.html > /tmp/index.html
          ! grep -q 'sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0' /tmp/index.html
          grep -q 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0' /tmp/index.html
          grep -q 'تسجيل الخروج' <(unzip -p "$APK" assets/www/ui-final-2027.js)
          echo 'APK verification passed'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thanwia-Comprehensive-Fix-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
