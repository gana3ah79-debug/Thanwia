name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply full final app configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          current = 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s = re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='" + current + "'", s, count=1)
          tags = ['final-features.js','payment-methods.js','admin-entry.js','ui-fixes.js','task-color-fix.js','ai-quiz-fix.js','login-screen-fix.js','quiz-screen-restore.js','auth-theme.js','login-polish.js']
          for f in tags:
              tag=f'<script src="{f}"></script>'
              if tag not in s: s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s, encoding='utf-8')
          assert "SUPABASE_KEY='" + current + "'" in s
          for f in tags: assert f'<script src="{f}"></script>' in s
          print('Full final app configuration verified')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Full APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Verify Full APK
        shell: bash
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html > /tmp/index.html
          grep -F "SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'" /tmp/index.html
          for f in final-features.js payment-methods.js admin-entry.js ui-fixes.js task-color-fix.js ai-quiz-fix.js login-screen-fix.js quiz-screen-restore.js auth-theme.js login-polish.js; do grep -F "$f" /tmp/index.html; unzip -l "$APK" | grep "assets/www/$f"; done
          grep -F 'تغيير كلمة السر' <(unzip -p "$APK" assets/www/auth-theme.js)
          grep -F 'rihla-explanation-v2' <(unzip -p "$APK" assets/www/quiz-screen-restore.js)
          echo 'FULL FINAL APK VERIFIED'

      - name: Upload Full Final APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-full-final-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
