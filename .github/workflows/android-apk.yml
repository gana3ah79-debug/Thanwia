name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and fix Supabase publishable key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbqK0'
          new = 'sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Corrected Supabase publishable key in APK source')
          else:
              print('Supabase key already current or not found')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk