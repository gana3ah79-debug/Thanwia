name: Build Native APK

on:
  workflow_dispatch:
  push:
    branches: [native-final]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build native debug APK
        working-directory: android_project
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify no WebView in native entry point
        run: |
          ! grep -Eq 'android.webkit.WebView|WebView|loadUrl\(' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          test -s android_project/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thanwia-Native-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
