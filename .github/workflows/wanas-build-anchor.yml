          if [ -n "$TAB_DIR" ]; then
            # The tab route is one directory deeper than app/app, so its Supabase import needs ../../src.
            sed -i "s#../src/lib/wanasSupabase#../../src/lib/wanasSupabase#g" "$AI_ROUTE_DIR/ai-games.tsx"
            LAYOUT="$(find "$TAB_DIR" -maxdepth 1 -type f -name '_layout.tsx' -print -quit)"
            if [ -n "$LAYOUT" ] && ! grep -q 'name="ai-games"' "$LAYOUT"; then
              python3 - "$LAYOUT" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text()
          if '<Tabs' in s and '</Tabs>' in s:
              s=s.replace('</Tabs>','  <Tabs.Screen name="ai-games" options={{ title: "ألعاب AI", headerShown: false }} />\\n</Tabs>',1)
              p.write_text(s)
              print("Added AI Games tab:",p)
          PY
            fi
          fi

          # Improve contrast in files that explicitly define a light/day theme.
          python3 - <<'PY'
          from pathlib import Path
          import re
          low={'#9ca3af':'#475569','#94a3b8':'#475569','#a1a1aa':'#52525b','#a3a3a3':'#52525b','#b0b0b0':'#52525b','#b5b5b5':'#52525b','#c0c0c0':'#475569'}
          changed=0
          for root in (Path('app'),Path('src')):
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.suffix not in {'.ts','.tsx','.js','.jsx'} or 'node_modules' in p.parts or 'android' in p.parts: continue
                  try:t=p.read_text()
                  except:continue
                  if not re.search(r'lightTheme|darkTheme|dayMode|nightMode|isDark|colorScheme|lightMode',t,re.I): continue
                  n=t
                  for a,b in low.items(): n=n.replace(a,b)
                  if n!=t:p.write_text(n);changed+=1
          print("Improved light-theme text contrast in",changed,"files")
          PY

          echo "AI route directory: $AI_ROUTE_DIR"
          find app -type f \( -name '_layout.tsx' -o -name 'index.tsx' -o -name 'ai-games.tsx' \) | sort
          grep -R "router\.\(replace\|push\|navigate\)(['\"]/index['\"]" app src --include='*.ts' --include='*.tsx' 2>/dev/null || true

      - name: Build Wanas engagement center
        working-directory: app
        shell: bash
        run: |
          set -e
          cp ../build/patches/engagement.tsx app/engagement.tsx
          python3 ../build/patches/admin_growth.py
          TAB_DIR="$(find app -type f -name '_layout.tsx' -print0 | xargs -0 grep -l '<Tabs' 2>/dev/null | head -n 1 | xargs -r dirname || true)"
          if [ -n "$TAB_DIR" ]; then
            LAYOUT="$(find "$TAB_DIR" -maxdepth 1 -type f -name '_layout.tsx' -print -quit)"
            if [ -n "$LAYOUT" ]; then python3 ../build/patches/add_engagement_tab.py "$LAYOUT"; fi
          fi
          echo "Wanas engagement and admin growth patches applied"

      - name: Prebuild Android
        working-directory: app
        env:
          EXPO_NO_DOCTOR: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Fix Kotlin Compose compatibility
        working-directory: app
        shell: bash
        run: |
          set -e
          find android -type f | grep -E '\.(gradle|gradle\.kts|toml)$|gradle\.properties$' | xargs -r sed -i 's/1\.9\.24/1.9.25/g'
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "Kotlin/Compose configuration:"
          grep -R "1.9.2" android --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='*.toml' || true
      - name: Build Release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
