name: Wanas APK Builder
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild source
        shell: bash
        run: |
          rm -rf app
          mkdir -p app
          cat build/chunks/*.b64 | tr -d '\n' | base64 -d > /tmp/wanas-source.tar.gz
          tar -tzf /tmp/wanas-source.tar.gz >/dev/null
          tar -xzf /tmp/wanas-source.tar.gz -C app
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Prebuild Android
        working-directory: app
        env:
          EXPO_NO_DOCTOR: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build Release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
