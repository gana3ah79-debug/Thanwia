name: Wanas APK Builder
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild source
        shell: bash
        run: |
          rm -rf app
          mkdir -p app
          cat build/fixedbin/*.part > /tmp/wanas-source.tar.gz
          tar -tzf /tmp/wanas-source.tar.gz >/dev/null
          tar -xzf /tmp/wanas-source.tar.gz -C app
      - name: Fix dynamic gift image imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/app/coins.tsx')
          s = p.read_text()
          marker = "import ar from '../src/lib/i18n';"
          block = """import ar from '../src/lib/i18n';

          const GIFT_IMAGES: Record<string, any> = {
            'gift_heart.png': require('../assets/images/gift_heart.png'),
            'gift_rose.png': require('../assets/images/gift_rose.png'),
            'gift_star.png': require('../assets/images/gift_star.png'),
            'gift_crown.png': require('../assets/images/gift_crown.png'),
          };"""
          if "const GIFT_IMAGES" not in s:
              if marker not in s:
                  raise SystemExit('coins.tsx import marker not found')
              s = s.replace(marker, block, 1)
          old = "require(`../assets/images/${g.image}`)"
          if old not in s:
              raise SystemExit('dynamic image require not found')
          p.write_text(s.replace(old, "GIFT_IMAGES[g.image]", 1))
          print('Patched coins.tsx')
          PY
      - name: Verify normalized images
        shell: bash
        run: |
          set -e
          file app/assets/images/*.png | tee /tmp/image-types.txt
          ! grep -E 'JPEG|JFIF' /tmp/image-types.txt
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Fix Expo Router query-string dependency
        working-directory: app
        run: npm install query-string@7.1.3 --save-exact --no-audit --no-fund
      - name: Align Kotlin versions in Expo modules
        working-directory: app
        shell: bash
        run: |
          set -e
          for root in node_modules/expo-modules-core node_modules/expo node_modules/@expo; do
            if [ -d "$root" ]; then
              find "$root" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' -o -name 'libs.versions.toml' \) -print0 |
                xargs -0 -r sed -i 's/1\.9\.24/1.9.25/g; s/1\.5\.15/1.5.14/g'
            fi
          done
          echo "Remaining Kotlin 1.9.24 references in Expo Gradle files:"
          for root in node_modules/expo-modules-core node_modules/expo node_modules/@expo; do
            if [ -d "$root" ]; then
              grep -R '1\.9\.24' "$root" --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='libs.versions.toml' 2>/dev/null || true
            fi
          done

      - name: Add Wanas Supabase and privacy features
        working-directory: app
        shell: bash
        run: |
          set -e
          mkdir -p app/app src/lib
          cat > src/lib/wanasSupabase.ts <<'EOF'
          import { createClient } from '@supabase/supabase-js';

          export const SUPABASE_URL = 'https://aenuzbaqskhyqwatrggg.supabase.co';
          export const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_WAI1Bf-pzTvfLXvjnbKCXw_vLo7Ce_2';

          export const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
          });
          EOF

          cat > app/app/index.tsx <<'EOF'
          import React, { useEffect, useState } from 'react';
          import { ActivityIndicator, View } from 'react-native';
          import { Redirect } from 'expo-router';
          import { supabase } from '../src/lib/wanasSupabase';

          export default function IndexDeepLink() {
            const [ready, setReady] = useState(false);
            const [loggedIn, setLoggedIn] = useState(false);

            useEffect(() => {
              let alive = true;
              supabase.auth.getSession().then(({ data }) => {
                if (!alive) return;
                setLoggedIn(!!data.session);
                setReady(true);
              }).catch(() => {
                if (alive) setReady(true);
              });
              return () => { alive = false; };
            }, []);

            if (!ready) {
              return <View style={{ flex: 1, alignItems: 'center', justifyContent: 'center', backgroundColor: '#0b1020' }}>
                <ActivityIndicator size="large" color="#4f7cff" />
              </View>;
            }

            return <Redirect href={loggedIn ? '/(tabs)' : '/login'} />;
          }
          EOF

          cp app/admin.tsx app/admin-legacy.tsx
          cat > app/admin.tsx <<'EOF'
          import React, { useCallback, useEffect, useState } from 'react';
          import { Alert, FlatList, RefreshControl, SafeAreaView, StyleSheet, Switch, Text, TextInput, TouchableOpacity, View } from 'react-native';
          import { router } from 'expo-router';
          import { supabase } from '../src/lib/wanasSupabase';

          type Profile = {
            id: string; name: string; email?: string | null; phone?: string | null; role: string;
            is_paid: boolean; incognito_enabled?: boolean; incognito_until?: string | null;
            last_seen?: string | null; created_at?: string | null;
          };

          type Payment = {
            id: number; user_id: string; name?: string | null; email?: string | null; amount: number;
            transaction_id: string; plan: string; status: string; created_at: string;
          };

          export default function AdminScreen() {
            const [profiles, setProfiles] = useState<Profile[]>([]);
            const [payments, setPayments] = useState<Payment[]>([]);
            const [loading, setLoading] = useState(true);
            const [serviceEnabled, setServiceEnabled] = useState(true);
            const [price, setPrice] = useState('0');
            const [days, setDays] = useState('30');

            const load = useCallback(async () => {
              setLoading(true);
              const [{ data: ps, error: pe }, { data: pms, error: me }, { data: setting }] = await Promise.all([
                supabase.from('profiles').select('id,name,email,phone,role,is_paid,incognito_enabled,incognito_until,last_seen,created_at').order('created_at', { ascending: false }),
                supabase.from('payment_submissions').select('id,user_id,name,email,amount,transaction_id,plan,status,created_at').eq('plan', 'incognito').order('created_at', { ascending: false }).limit(50),
                supabase.from('app_settings').select('value').eq('key', 'incognito_service').maybeSingle(),
              ]);
              if (pe) Alert.alert('خطأ', pe.message);
              if (me) Alert.alert('خطأ', me.message);
              setProfiles((ps || []) as Profile[]);
              setPayments((pms || []) as Payment[]);
              const v = setting?.value as any;
              if (v) {
                setServiceEnabled(v.enabled !== false);
                setPrice(String(v.price ?? 0));
                setDays(String(v.days ?? 30));
              }
              setLoading(false);
            }, []);

            useEffect(() => { load(); }, [load]);

            const saveService = async () => {
              const p = Math.max(0, Number(price) || 0);
              const d = Math.max(1, Number(days) || 30);
              const { error } = await supabase.from('app_settings').upsert({
                key: 'incognito_service',
                value: { enabled: serviceEnabled, price: p, days: d },
                updated_at: new Date().toISOString(),
              });
              if (error) Alert.alert('خطأ', error.message);
              else Alert.alert('تم', 'تم حفظ إعدادات وضع التخفي');
            };

            const toggleIncognito = async (user: Profile, value: boolean) => {
              const until = value ? new Date(Date.now() + 30 * 86400000).toISOString() : null;
              const { error } = await supabase.from('profiles').update({
                incognito_enabled: value, incognito_until: until,
              }).eq('id', user.id);
              if (error) Alert.alert('خطأ', error.message);
              else setProfiles(x => x.map(p => p.id === user.id ? { ...p, incognito_enabled: value, incognito_until: until } : p));
            };

            const approve = async (payment: Payment) => {
              const { error } = await supabase.from('payment_submissions').update({
                status: 'approved', reviewed_at: new Date().toISOString(),
              }).eq('id', payment.id);
              if (error) Alert.alert('خطأ', error.message);
              else { Alert.alert('تم', 'تم اعتماد طلب التخفي، وسيتم تفعيله تلقائياً'); load(); }
            };

            const reject = async (payment: Payment) => {
              const { error } = await supabase.from('payment_submissions').update({
                status: 'rejected', reviewed_at: new Date().toISOString(),
              }).eq('id', payment.id);
              if (error) Alert.alert('خطأ', error.message); else load();
            };

            return (
              <SafeAreaView style={styles.root}>
                <FlatList
                  data={profiles}
                  keyExtractor={x => x.id}
                  refreshControl={<RefreshControl refreshing={loading} onRefresh={load} />}
                  ListHeaderComponent={
                    <View>
                      <Text style={styles.title}>لوحة إدارة Wanas</Text>
                      <Text style={styles.sub}>المستخدم المخفي يظهر هنا دائماً، وبجواره علامة «متخفى».</Text>

                      <View style={styles.card}>
                        <Text style={styles.h2}>خدمة وضع التخفي المدفوعة</Text>
                        <View style={styles.row}><Text style={styles.label}>الخدمة متاحة</Text><Switch value={serviceEnabled} onValueChange={setServiceEnabled}/></View>
                        <Text style={styles.label}>السعر</Text>
                        <TextInput style={styles.input} value={price} onChangeText={setPrice} keyboardType="numeric" placeholder="0"/>
                        <Text style={styles.label}>مدة الاشتراك بالأيام</Text>
                        <TextInput style={styles.input} value={days} onChangeText={setDays} keyboardType="numeric" />
                        <TouchableOpacity style={styles.primary} onPress={saveService}><Text style={styles.primaryText}>حفظ إعدادات الخدمة</Text></TouchableOpacity>
                      </View>

                      <View style={styles.card}>
                        <Text style={styles.h2}>طلبات التخفي ({payments.filter(x => x.status === 'pending').length})</Text>
                        {payments.length === 0 ? <Text style={styles.muted}>لا توجد طلبات حالياً</Text> : payments.map(p => (
                          <View key={p.id} style={styles.payment}>
                            <Text style={styles.user}>{p.name || p.email || p.user_id}</Text>
                            <Text style={styles.muted}>المبلغ: {p.amount} • رقم العملية: {p.transaction_id || '—'}</Text>
                            <Text style={styles.muted}>الحالة: {p.status}</Text>
                            {p.status === 'pending' && <View style={styles.row}>
                              <TouchableOpacity style={styles.approve} onPress={() => approve(p)}><Text style={styles.btnText}>اعتماد</Text></TouchableOpacity>
                              <TouchableOpacity style={styles.reject} onPress={() => reject(p)}><Text style={styles.btnText}>رفض</Text></TouchableOpacity>
                            </View>}
                          </View>
                        ))}
                      </View>

                      <View style={styles.card}>
                        <Text style={styles.h2}>المستخدمون ({profiles.length})</Text>
                        <TouchableOpacity style={styles.secondary} onPress={() => router.push('/admin-legacy')}><Text>فتح لوحة الإدارة الأصلية</Text></TouchableOpacity>
                      </View>
                    </View>
                  }
                  renderItem={({item}) => (
                    <View style={styles.userCard}>
                      <View style={{flex:1}}>
                        <View style={styles.row}>
                          <Text style={styles.user}>{item.name || 'بدون اسم'}</Text>
                          {item.incognito_enabled && <Text style={styles.badge}>متخفى</Text>}
                          {item.role === 'admin' && <Text style={styles.adminBadge}>ADMIN</Text>}
                        </View>
                        <Text style={styles.muted}>{item.email || item.phone || item.id}</Text>
                        <Text style={styles.muted}>تسجيل: {item.created_at ? new Date(item.created_at).toLocaleDateString('ar-EG') : '—'}</Text>
                      </View>
                      <Switch value={!!item.incognito_enabled} onValueChange={v => toggleIncognito(item, v)} />
                    </View>
                  )}
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            root:{flex:1,backgroundColor:'#0b1020'},
            title:{fontSize:26,fontWeight:'800',color:'#fff',textAlign:'right',padding:18,paddingBottom:6},
            sub:{color:'#aeb8d0',textAlign:'right',paddingHorizontal:18,paddingBottom:10},
            card:{backgroundColor:'#141b2d',marginHorizontal:12,marginVertical:8,borderRadius:16,padding:15},
            h2:{fontSize:19,fontWeight:'800',color:'#fff',textAlign:'right',marginBottom:12},
            label:{color:'#cbd4ea',textAlign:'right',marginTop:8,marginBottom:5},
            input:{backgroundColor:'#0d1425',color:'#fff',borderRadius:10,padding:11,textAlign:'right'},
            row:{flexDirection:'row',alignItems:'center',gap:8,marginTop:8},
            primary:{backgroundColor:'#4f7cff',padding:13,borderRadius:11,alignItems:'center',marginTop:12},
            primaryText:{color:'#fff',fontWeight:'800'},
            secondary:{backgroundColor:'#e8edf8',padding:12,borderRadius:10,alignItems:'center'},
            userCard:{flexDirection:'row',alignItems:'center',backgroundColor:'#141b2d',marginHorizontal:12,marginVertical:5,borderRadius:14,padding:13},
            user:{color:'#fff',fontSize:16,fontWeight:'700'},
            muted:{color:'#9ba7c0',fontSize:12,textAlign:'right',marginTop:3},
            badge:{backgroundColor:'#7c3aed',color:'#fff',paddingHorizontal:8,paddingVertical:3,borderRadius:8,fontSize:11,fontWeight:'800'},
            adminBadge:{backgroundColor:'#1d9bf0',color:'#fff',paddingHorizontal:7,paddingVertical:3,borderRadius:8,fontSize:10,fontWeight:'800'},
            payment:{borderTopWidth:1,borderTopColor:'#29334d',paddingTop:10,marginTop:8},
            approve:{backgroundColor:'#159447',padding:9,borderRadius:9},
            reject:{backgroundColor:'#b52d3b',padding:9,borderRadius:9},
            btnText:{color:'#fff',fontWeight:'800'}
          });
          EOF

          cp app/premium.tsx app/premium-legacy.tsx
          cat > app/premium.tsx <<'EOF'
          import React, { useEffect, useState } from 'react';
          import { Alert, SafeAreaView, StyleSheet, Text, TextInput, TouchableOpacity, View } from 'react-native';
          import { router } from 'expo-router';
          import { supabase } from '../src/lib/wanasSupabase';

          export default function PremiumScreen() {
            const [price, setPrice] = useState(0);
            const [days, setDays] = useState(30);
            const [enabled, setEnabled] = useState(true);
            const [transaction, setTransaction] = useState('');
            const [status, setStatus] = useState<string | null>(null);

            useEffect(() => {
              (async () => {
                const { data } = await supabase.from('app_settings').select('value').eq('key','incognito_service').maybeSingle();
                const v = data?.value as any;
                if (v) { setEnabled(v.enabled !== false); setPrice(Number(v.price || 0)); setDays(Number(v.days || 30)); }
                const { data: session } = await supabase.auth.getSession();
                if (session.session?.user) {
                  const { data: p } = await supabase.from('payment_submissions').select('status').eq('user_id',session.session.user.id).eq('plan','incognito').order('created_at',{ascending:false}).limit(1).maybeSingle();
                  setStatus(p?.status || null);
                }
              })();
            }, []);

            const submit = async () => {
              if (!transaction.trim()) return Alert.alert('مطلوب','اكتب رقم عملية التحويل بعد الدفع.');
              const { data: session } = await supabase.auth.getSession();
              const user = session.session?.user;
              if (!user) return Alert.alert('تسجيل الدخول','سجل الدخول أولاً.');
              const { data: profile } = await supabase.from('profiles').select('name,email,phone').eq('id',user.id).maybeSingle();
              const { error } = await supabase.from('payment_submissions').insert({
                user_id:user.id, name:profile?.name || user.user_metadata?.name || 'عضو',
                email:profile?.email || user.email, phone:profile?.phone || null,
                transaction_id:transaction.trim(), plan:'incognito', amount:price, status:'pending'
              });
              if (error) Alert.alert('خطأ',error.message);
              else { setStatus('pending'); Alert.alert('تم','تم إرسال طلب التفعيل للإدارة.'); }
            };

            return <SafeAreaView style={styles.root}><View style={styles.box}>
              <Text style={styles.title}>🕶️ وضع التخفي</Text>
              <Text style={styles.desc}>عند التفعيل لا يظهر حسابك في قوائم الأعضاء للمستخدمين، بينما يظل ظاهرًا للإدارة ومكتوبًا بجواره «متخفى».</Text>
              {!enabled ? <Text style={styles.off}>الخدمة متوقفة حاليًا من الإدارة.</Text> : <>
                <Text style={styles.price}>{price > 0 ? price + ' جنيه / ' + days + ' يوم' : 'السعر تحدده الإدارة'}</Text>
                <TextInput value={transaction} onChangeText={setTransaction} placeholder="رقم عملية التحويل" placeholderTextColor="#77809a" style={styles.input}/>
                <TouchableOpacity style={styles.button} onPress={submit} disabled={status==='pending'}><Text style={styles.buttonText}>{status==='pending'?'الطلب قيد المراجعة':'إرسال طلب التفعيل'}</Text></TouchableOpacity>
                {status && <Text style={styles.status}>آخر طلب: {status}</Text>}
              </>}
              <TouchableOpacity style={styles.link} onPress={() => router.push('/premium-legacy')}><Text style={styles.linkText}>الميزات المدفوعة الحالية</Text></TouchableOpacity>
            </View></SafeAreaView>
          }
          const styles=StyleSheet.create({
            root:{flex:1,backgroundColor:'#0b1020',justifyContent:'center',padding:18},
            box:{backgroundColor:'#141b2d',borderRadius:20,padding:20},
            title:{fontSize:27,fontWeight:'900',color:'#fff',textAlign:'right',marginBottom:12},
            desc:{color:'#c5cee2',fontSize:15,lineHeight:24,textAlign:'right'},
            price:{color:'#72a1ff',fontSize:19,fontWeight:'800',textAlign:'right',marginVertical:18},
            input:{backgroundColor:'#0d1425',color:'#fff',padding:13,borderRadius:11,textAlign:'right'},
            button:{backgroundColor:'#4f7cff',padding:14,borderRadius:11,alignItems:'center',marginTop:12},
            buttonText:{color:'#fff',fontWeight:'900'},
            status:{color:'#a9f0bd',textAlign:'right',marginTop:10},
            off:{color:'#ff9da8',textAlign:'right',marginVertical:15},
            link:{padding:13,alignItems:'center',marginTop:12},
            linkText:{color:'#9fb8ff'}
          });
          EOF
      - name: Prebuild Android
        working-directory: app
        env:
          EXPO_NO_DOCTOR: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Fix Kotlin Compose compatibility
        working-directory: app
        shell: bash
        run: |
          set -e
          find android -type f | grep -E '\.(gradle|gradle\.kts|toml)$|gradle\.properties$' | xargs -r sed -i 's/1\.9\.24/1.9.25/g'
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "Kotlin/Compose configuration:"
          grep -R "1.9.2" android --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='*.toml' || true
      - name: Build Release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
