name: Wanas APK Builder
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild source
        shell: bash
        run: |
          rm -rf app
          mkdir -p app
          cat build/fixedbin/*.part > /tmp/wanas-source.tar.gz
          tar -tzf /tmp/wanas-source.tar.gz >/dev/null
          tar -xzf /tmp/wanas-source.tar.gz -C app
      - name: Fix dynamic gift image imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/app/coins.tsx')
          s = p.read_text()
          marker = "import ar from '../src/lib/i18n';"
          block = """import ar from '../src/lib/i18n';

          const GIFT_IMAGES: Record<string, any> = {
            'gift_heart.png': require('../assets/images/gift_heart.png'),
            'gift_rose.png': require('../assets/images/gift_rose.png'),
            'gift_star.png': require('../assets/images/gift_star.png'),
            'gift_crown.png': require('../assets/images/gift_crown.png'),
          };"""
          if "const GIFT_IMAGES" not in s:
              if marker not in s:
                  raise SystemExit('coins.tsx import marker not found')
              s = s.replace(marker, block, 1)
          old = "require(`../assets/images/${g.image}`)"
          if old not in s:
              raise SystemExit('dynamic image require not found')
          p.write_text(s.replace(old, "GIFT_IMAGES[g.image]", 1))
          print('Patched coins.tsx')
          PY
      - name: Verify normalized images
        shell: bash
        run: |
          set -e
          file app/assets/images/*.png | tee /tmp/image-types.txt
          ! grep -E 'JPEG|JFIF' /tmp/image-types.txt
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Add React Native auth persistence
        working-directory: app
        run: npm install @react-native-async-storage/async-storage react-native-url-polyfill --save-exact --no-audit --no-fund

      - name: Fix Expo Router query-string dependency
        working-directory: app
        run: npm install query-string@7.1.3 --save-exact --no-audit --no-fund
      - name: Align Kotlin versions in Expo modules
        working-directory: app
        shell: bash
        run: |
          set -e
          for root in node_modules/expo-modules-core node_modules/expo node_modules/@expo; do
            if [ -d "$root" ]; then
              find "$root" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' -o -name 'libs.versions.toml' \) -print0 |
                xargs -0 -r sed -i 's/1\.9\.24/1.9.25/g; s/1\.5\.15/1.5.14/g'
            fi
          done
          echo "Remaining Kotlin 1.9.24 references in Expo Gradle files:"
          for root in node_modules/expo-modules-core node_modules/expo node_modules/@expo; do
            if [ -d "$root" ]; then
              grep -R '1\.9\.24' "$root" --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='libs.versions.toml' 2>/dev/null || true
            fi
          done

      - name: Add Wanas Supabase and privacy features
        working-directory: app
        shell: bash
        run: |
          set -e
          mkdir -p app/app src/lib
          cat > src/lib/wanasSupabase.ts <<'EOF'
          import { AppState } from 'react-native';
          import AsyncStorage from '@react-native-async-storage/async-storage';
          import 'react-native-url-polyfill/auto';
          import { createClient } from '@supabase/supabase-js';

          export const SUPABASE_URL = 'https://aenuzbaqskhyqwatrggg.supabase.co';
          export const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_WAI1Bf-pzTvfLXvjnbKCXw_vLo7Ce_2';

          export const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: {
              storage: AsyncStorage,
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: false,
            },
          });

          AppState.addEventListener('change', (state) => {
            if (state === 'active') supabase.auth.startAutoRefresh();
            else supabase.auth.stopAutoRefresh();
          });
          EOF



          # Compatibility route: older builds/deep-links use /index.
          # Expo Router maps app/app/index.tsx to /, so /index needs a real alias.
          mkdir -p app/app/index
          cat > app/app/index/index.tsx <<'EOF'
          import { Redirect } from 'expo-router';
          export default function LegacyIndexRoute() {
            return <Redirect href="/" />;
          }
          EOF

          # Normalize every common object-style /index navigation as well.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('app')
          for p in root.rglob('*'):
              if p.suffix not in {'.ts','.tsx','.js','.jsx'} or 'node_modules' in p.parts or 'android' in p.parts: continue
              try:t=p.read_text()
              except:continue
              n=t.replace("pathname: '/index'","pathname: '/'").replace('pathname: "/index"','pathname: "/"')
              n=n.replace("href: '/index'","href: '/'").replace('href: "/index"','href: "/"')
              n=n.replace("url: 'wanas:///index'","url: 'wanas:///'").replace('url: "wanas:///index"','url: "wanas:///"')
              if n!=t:p.write_text(n)
          PY

          # Activate previously placeholder admin areas using real Supabase data.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/admin.tsx'); s=p.read_text()

          s=s.replace(
          "const [notice,setNotice]=useState('');",
          """const [notice,setNotice]=useState('');
            const [aiQuestions,setAiQuestions]=useState<any[]>([]);
            const [aiRuns,setAiRuns]=useState<any[]>([]);
            const [challengeRooms,setChallengeRooms]=useState<any[]>([]);
            const [supportReplies,setSupportReplies]=useState<Record<string,string>>({});"""
          )

          s=s.replace(
          "supabase.from('admin_settings').select('*'),",
          """supabase.from('admin_settings').select('*'),
                supabase.from('ai_generated_questions').select('id,subject,unit,lesson,stem,difficulty,quality_score,status,created_at,model').order('created_at',{ascending:false}).limit(100),
                supabase.from('ai_generation_runs').select('id,subject,unit,lesson,count_requested,count_generated,status,model,created_at,error_message').order('created_at',{ascending:false}).limit(50),
                supabase.from('challenge_rooms').select('pin,host_user_id,subject,topic,rounds,status,created_at,updated_at').order('created_at',{ascending:false}).limit(50),"""
          )

          s=s.replace(
          "const [pr,pm,sp,lg,se,ar,as]=results;",
          "const [pr,pm,sp,lg,se,ar,as,aq,ag,cr]=results;"
          )

          s=s.replace(
          "setSecurity(se.data||[]);",
          """setSecurity(se.data||[]);
              setAiQuestions(aq.data||[]);
              setAiRuns(ag.data||[]);
              setChallengeRooms(cr.data||[]);"""
          )

          s=s.replace(
          "const sendMessage=async()=>{",
          """const replySupport=async(ticket:any)=>{
              const reply=(supportReplies[ticket.id]||'').trim();
              if(!reply)return Alert.alert('مطلوب','اكتب الرد أولاً.');
              const {error}=await supabase.from('support_tickets').update({admin_reply:reply,status:'answered',updated_at:new Date().toISOString()}).eq('id',ticket.id);
              if(error)Alert.alert('خطأ',error.message);
              else {setSupportReplies(x=>({...x,[ticket.id]:''}));await writeLog('reply_support_ticket',ticket.user_id,{ticket_id:ticket.id});load();}
            };

            const moderateAIQuestion=async(q:any,status:string)=>{
              const {error}=await supabase.from('ai_generated_questions').update({status}).eq('id',q.id);
              if(error)Alert.alert('خطأ',error.message);
              else {await writeLog('moderate_ai_question',undefined,{question_id:q.id,status});setAiQuestions(x=>x.map(v=>v.id===q.id?{...v,status}:v));}
            };

            const sendMessage=async()=>{"""
          )

          old_comments="""              if(tab==='comments')return <><Back/><SectionHeader title="إدارة التعليقات" icon="chatbubbles-outline"/><View style={styles.card}><Text style={styles.h2}>مركز مراجعة التعليقات</Text><Text style={styles.muted}>تم تجهيز قسم الإدارة لربطه بجدول التعليقات. إذا كان جدول comments موجودًا في Supabase سيتم تفعيله في الخطوة التالية بدون تغيير واجهة الأعضاء.</Text><View style={styles.infoRow}><Ionicons name="information-circle-outline" size={20} color="#77a2ff"/><Text style={styles.muted}>الهدف: إخفاء التعليق، حذف المخالفات، مراجعة البلاغات وترتيب الأحدث أولًا.</Text></View></View></>;"""
          new_comments="""              if(tab==='comments')return <><Back/><SectionHeader title="إدارة المحتوى والتعليقات" icon="chatbubbles-outline"/>
                <View style={styles.card}><Text style={styles.h2}>بنك أسئلة AI</Text><Text style={styles.muted}>إدارة فعلية للأسئلة التي يولدها الذكاء الاصطناعي وتستخدمها الألعاب والاختبارات.</Text>
                {aiQuestions.slice(0,30).map(q=><View style={styles.payment} key={q.id}><Text style={styles.user}>{q.subject} • {q.difficulty||'medium'} • جودة {q.quality_score??'-'}</Text><Text style={styles.muted}>{q.stem}</Text><Text style={styles.log}>{q.status} • {q.created_at?.slice(0,10)}</Text><View style={styles.actionRow}>
                <TouchableOpacity style={styles.approve} onPress={()=>moderateAIQuestion(q,'approved')}><Text style={styles.btnText}>اعتماد</Text></TouchableOpacity>
                <TouchableOpacity style={styles.reject} onPress={()=>moderateAIQuestion(q,'rejected')}><Text style={styles.btnText}>استبعاد</Text></TouchableOpacity>
                </View></View>)}
                {aiQuestions.length===0&&<Text style={styles.muted}>لا توجد أسئلة AI مسجلة حاليًا.</Text>}</View>
                <View style={styles.card}><Text style={styles.h2}>تشغيلات توليد الأسئلة</Text>{aiRuns.slice(0,15).map(x=><Text key={x.id} style={styles.log}>{x.subject} • {x.count_generated}/{x.count_requested} • {x.status} • {x.created_at?.slice(0,19).replace('T',' ')}</Text>)}</View></>;"""

          s=s.replace(old_comments,new_comments)

          old_media="""              if(tab==='media')return <><Back/><SectionHeader title="إدارة الصور والفيديو" icon="images-outline"/><View style={styles.card}><Text style={styles.h2}>مركز الوسائط</Text><Text style={styles.muted}>قسم موحد لمراجعة الصور والفيديوهات والإبلاغات، مع إبقاء ملفات المستخدمين خارج لوحة الإدارة إلا عند الحاجة.</Text><View style={styles.infoRow}><Ionicons name="checkmark-circle-outline" size={20} color="#5fe09b"/><Text style={styles.muted}>تم تجهيز نقطة الإدارة وإجراءات السجل الأمني.</Text></View></View></>;"""
          new_media="""              if(tab==='media')return <><Back/><SectionHeader title="إدارة الألعاب والوسائط" icon="images-outline"/>
                <View style={styles.card}><Text style={styles.h2}>غرف الألعاب الحالية</Text><Text style={styles.muted}>مراقبة غرف التحديات الحقيقية الموجودة في قاعدة البيانات.</Text>
                {challengeRooms.slice(0,30).map(x=><View style={styles.payment} key={x.pin}><Text style={styles.user}>{x.subject} • {x.topic||'بدون موضوع'}</Text><Text style={styles.muted}>PIN: {x.pin} • الجولات: {x.rounds} • الحالة: {x.status}</Text><Text style={styles.log}>{x.created_at?.slice(0,19).replace('T',' ')}</Text></View>)}
                {challengeRooms.length===0&&<Text style={styles.muted}>لا توجد غرف ألعاب حاليًا.</Text>}</View>
                <View style={styles.card}><Text style={styles.h2}>الوسائط</Text><Text style={styles.muted}>لا يوجد حاليًا جدول وسائط/صور مستقل في قاعدة بيانات Wanas؛ لذلك لم أضع زرًا وهميًا لحذف ملفات غير موجودة. عند إضافة جدول الوسائط سيتم ربط هذا القسم به مباشرة.</Text></View></>;"""

          s=s.replace(old_media,new_media)

          old_support="""              if(tab==='support')return <><Back/><SectionHeader title="الدعم والشكاوى" icon="headset-outline"/>{support.length===0?<Text style={styles.muted}>لا توجد تذاكر أو أن جدول الدعم فارغ.</Text>:support.map(x=><View style={styles.card} key={x.id}><Text style={styles.user}>{x.subject}</Text><Text style={styles.muted}>{x.message}</Text><Text style={styles.log}>الحالة: {x.status} • {x.created_at?.slice(0,10)}</Text>{x.status==='open'&&<TouchableOpacity style={styles.secondary} onPress={async()=>{await supabase.from('support_tickets').update({status:'closed',updated_at:new Date().toISOString()}).eq('id',x.id);writeLog('close_support_ticket',x.user_id);load();}}><Text style={styles.secondaryText}>إغلاق التذكرة</Text></TouchableOpacity>}</View>)}</>;"""
          new_support="""              if(tab==='support')return <><Back/><SectionHeader title="الدعم والشكاوى" icon="headset-outline"/>{support.length===0?<Text style={styles.muted}>لا توجد تذاكر.</Text>:support.map(x=><View style={styles.card} key={x.id}><Text style={styles.user}>{x.subject}</Text><Text style={styles.muted}>{x.message}</Text>{x.admin_reply&&<Text style={styles.health}>رد الإدارة: {x.admin_reply}</Text>}<Text style={styles.log}>الحالة: {x.status} • {x.created_at?.slice(0,10)}</Text><TextInput value={supportReplies[x.id]||''} onChangeText={v=>setSupportReplies(r=>({...r,[x.id]:v}))} placeholder="اكتب رد الإدارة" placeholderTextColor="#71809c" style={[styles.input,{height:75,textAlignVertical:'top'}]}/><View style={styles.actionRow}><TouchableOpacity style={styles.approve} onPress={()=>replySupport(x)}><Text style={styles.btnText}>إرسال الرد</Text></TouchableOpacity><TouchableOpacity style={styles.secondary} onPress={async()=>{await supabase.from('support_tickets').update({status:'closed',updated_at:new Date().toISOString()}).eq('id',x.id);await writeLog('close_support_ticket',x.user_id,{ticket_id:x.id});load();}}><Text style={styles.secondaryText}>إغلاق</Text></TouchableOpacity></View></View>)}</>;"""

          s=s.replace(old_support,new_support)

          p.write_text(s)
          print('Admin functional patch applied')
          PY

          cp app/admin.tsx app/admin-legacy.tsx
          cat > app/admin.tsx <<'EOF'
          import React, { useCallback, useEffect, useMemo, useState } from 'react';
          import { Alert, FlatList, RefreshControl, SafeAreaView, ScrollView, StyleSheet, Switch, Text, TextInput, TouchableOpacity, View } from 'react-native';
          import { Ionicons } from '@expo/vector-icons';
          import { supabase } from '../src/lib/wanasSupabase';

          type Profile = {
            id: string; name?: string | null; email?: string | null; phone?: string | null; role: string;
            is_paid: boolean; incognito_enabled?: boolean; incognito_until?: string | null;
            last_seen?: string | null; created_at?: string | null;
          };
          type Payment = { id:number; user_id:string; name?:string|null; email?:string|null; amount:number; transaction_id:string; plan:string; status:string; created_at:string };
          type Feature = { key:string; title:string; subtitle:string; icon:keyof typeof Ionicons.glyphMap };
          type PermissionKey = 'dashboard'|'users'|'comments'|'support'|'security'|'content'|'settings';

          const FEATURES: Feature[] = [
            {key:'overview',title:'الإحصائيات المتقدمة',subtitle:'أرقام المستخدمين والنشاط والدفع',icon:'analytics-outline'},
            {key:'users',title:'إدارة المستخدمين',subtitle:'بحث وحالة الحساب والتخفي',icon:'people-outline'},
            {key:'roles',title:'صلاحيات الأدمن',subtitle:'تحديد ما يستطيع كل أدمن فعله',icon:'shield-checkmark-outline'},
            {key:'comments',title:'إدارة التعليقات',subtitle:'مراجعة المحتوى والمخالفات',icon:'chatbubbles-outline'},
            {key:'notifications',title:'مركز الإشعارات',subtitle:'إعلانات وإشعارات عامة',icon:'notifications-outline'},
            {key:'security',title:'الحماية والحسابات الوهمية',subtitle:'أحداث الأمان والحظر اليدوي',icon:'lock-closed-outline'},
            {key:'support',title:'الدعم والشكاوى',subtitle:'متابعة تذاكر الأعضاء والرد عليها',icon:'headset-outline'},
            {key:'media',title:'إدارة الصور والفيديو',subtitle:'حالة الوسائط والمراجعة',icon:'images-outline'},
            {key:'backup',title:'النسخ الاحتياطي والاستعادة',subtitle:'حفظ إعدادات اللوحة واستعادتها',icon:'cloud-upload-outline'},
            {key:'system',title:'مراقبة النظام والأخطاء',subtitle:'فحص الاتصال والأحداث',icon:'pulse-outline'},
            {key:'messages',title:'رسائل الأدمن',subtitle:'إرسال رسالة مباشرة لعضو',icon:'mail-unread-outline'},
            {key:'settings',title:'إعدادات التطبيق',subtitle:'الخصوصية والخدمات والتحكم العام',icon:'settings-outline'},
          ];

          const DEFAULT_PERMS:Record<PermissionKey,boolean> = {dashboard:true,users:false,comments:false,support:false,security:false,content:false,settings:false};

          export default function AdminScreen(){
            const [tab,setTab]=useState('overview');
            const [profiles,setProfiles]=useState<Profile[]>([]);
            const [payments,setPayments]=useState<Payment[]>([]);
            const [support,setSupport]=useState<any[]>([]);
            const [logs,setLogs]=useState<any[]>([]);
            const [security,setSecurity]=useState<any[]>([]);
            const [admins,setAdmins]=useState<Profile[]>([]);
            const [loading,setLoading]=useState(true);
            const [serviceEnabled,setServiceEnabled]=useState(true);
            const [price,setPrice]=useState('0');
            const [days,setDays]=useState('30');
            const [announcementTitle,setAnnouncementTitle]=useState('');
            const [announcementBody,setAnnouncementBody]=useState('');
            const [messageUser,setMessageUser]=useState('');
            const [messageText,setMessageText]=useState('');
            const [search,setSearch]=useState('');
            const [permissionMap,setPermissionMap]=useState<Record<string,Record<PermissionKey,boolean>>>({});
            const [appSettings,setAppSettings]=useState<Record<string,any>>({});
            const [notice,setNotice]=useState('');

            const adminIdRef=React.useRef<string|null>(null);

            const load=useCallback(async()=>{
              setLoading(true);
              const session=await supabase.auth.getSession();
              adminIdRef.current=session.data.session?.user?.id || null;
              const results=await Promise.all([
                supabase.from('profiles').select('id,name,email,phone,role,is_paid,incognito_enabled,incognito_until,last_seen,created_at').order('created_at',{ascending:false}),
                supabase.from('payment_submissions').select('id,user_id,name,email,amount,transaction_id,plan,status,created_at').eq('plan','incognito').order('created_at',{ascending:false}).limit(100),
                supabase.from('support_tickets').select('*').order('created_at',{ascending:false}).limit(100),
                supabase.from('admin_logs').select('*').order('created_at',{ascending:false}).limit(80),
                supabase.from('security_events').select('*').order('created_at',{ascending:false}).limit(80),
                supabase.from('admin_roles').select('*'),
                supabase.from('admin_settings').select('*'),
              ]);
              const [pr,pm,sp,lg,se,ar,as]=results;
              setProfiles((pr.data||[]) as Profile[]);
              setPayments((pm.data||[]) as Payment[]);
              setSupport(sp.data||[]);
              setLogs(lg.data||[]);
              setSecurity(se.data||[]);
              const ad=(pr.data||[]).filter((x:any)=>x.role==='admin') as Profile[];
              setAdmins(ad);
              const map:any={};
              (ar.data||[]).forEach((x:any)=>map[x.user_id]={...DEFAULT_PERMS,...(x.permissions||{})});
              ad.forEach(a=>{if(!map[a.id])map[a.id]={...DEFAULT_PERMS,dashboard:true};});
              setPermissionMap(map);
              const settings:any={};
              (as.data||[]).forEach((x:any)=>settings[x.key]=x.value);
              setAppSettings(settings);
              const inc=settings.incognito_service;
              if(inc){setServiceEnabled(inc.enabled!==false);setPrice(String(inc.price??0));setDays(String(inc.days??30));}
              if(pr.error) setNotice('تعذر تحميل المستخدمين: '+pr.error.message);
              setLoading(false);
            },[]);

            useEffect(()=>{load();},[load]);

            const writeLog=async(action:string,target?:string,details:any={})=>{
              if(!adminIdRef.current)return;
              await supabase.from('admin_logs').insert({admin_id:adminIdRef.current,action,target_user_id:target||null,details});
            };

            const saveService=async()=>{
              const value={enabled:serviceEnabled,price:Math.max(0,Number(price)||0),days:Math.max(1,Number(days)||30)};
              const {error}=await supabase.from('app_settings').upsert({key:'incognito_service',value,updated_at:new Date().toISOString()});
              if(error)Alert.alert('خطأ',error.message); else {await writeLog('update_incognito_service',undefined,value);Alert.alert('تم','تم حفظ إعدادات خدمة التخفي');}
            };

            const toggleIncognito=async(u:Profile,value:boolean)=>{
              const until=value?new Date(Date.now()+30*86400000).toISOString():null;
              const {error}=await supabase.from('profiles').update({incognito_enabled:value,incognito_until:until}).eq('id',u.id);
              if(error)Alert.alert('خطأ',error.message); else {setProfiles(x=>x.map(p=>p.id===u.id?{...p,incognito_enabled:value,incognito_until:until}:p));await writeLog(value?'enable_incognito':'disable_incognito',u.id);}
            };

            const approve=async(p:Payment)=>{
              const {error}=await supabase.from('payment_submissions').update({status:'approved',reviewed_at:new Date().toISOString()}).eq('id',p.id);
              if(error)Alert.alert('خطأ',error.message);else{await writeLog('approve_payment',p.user_id,{payment_id:p.id});load();}
            };
            const reject=async(p:Payment)=>{
              const {error}=await supabase.from('payment_submissions').update({status:'rejected',reviewed_at:new Date().toISOString()}).eq('id',p.id);
              if(error)Alert.alert('خطأ',error.message);else{await writeLog('reject_payment',p.user_id,{payment_id:p.id});load();}
            };

            const sendAnnouncement=async()=>{
