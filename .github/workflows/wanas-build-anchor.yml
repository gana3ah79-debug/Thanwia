          cp app/premium.tsx app/premium-legacy.tsx
          cat > app/premium.tsx <<'EOF'
          import React, { useEffect, useState } from 'react';
          import { Alert, SafeAreaView, StyleSheet, Text, TextInput, TouchableOpacity, View } from 'react-native';
          import { router } from 'expo-router';
          import { supabase } from '../src/lib/wanasSupabase';

          export default function PremiumScreen() {
            const [price, setPrice] = useState(0);
            const [days, setDays] = useState(30);
            const [enabled, setEnabled] = useState(true);
            const [transaction, setTransaction] = useState('');
            const [status, setStatus] = useState<string | null>(null);

            useEffect(() => {
              (async () => {
                const { data } = await supabase.from('app_settings').select('value').eq('key','incognito_service').maybeSingle();
                const v = data?.value as any;
                if (v) { setEnabled(v.enabled !== false); setPrice(Number(v.price || 0)); setDays(Number(v.days || 30)); }
                const { data: session } = await supabase.auth.getSession();
                if (session.session?.user) {
                  const { data: p } = await supabase.from('payment_submissions').select('status').eq('user_id',session.session.user.id).eq('plan','incognito').order('created_at',{ascending:false}).limit(1).maybeSingle();
                  setStatus(p?.status || null);
                }
              })();
            }, []);

            const submit = async () => {
              if (!transaction.trim()) return Alert.alert('مطلوب','اكتب رقم عملية التحويل بعد الدفع.');
              const { data: session } = await supabase.auth.getSession();
              const user = session.session?.user;
              if (!user) return Alert.alert('تسجيل الدخول','سجل الدخول أولاً.');
              const { data: profile } = await supabase.from('profiles').select('name,email,phone').eq('id',user.id).maybeSingle();
              const { error } = await supabase.from('payment_submissions').insert({
                user_id:user.id, name:profile?.name || user.user_metadata?.name || 'عضو',
                email:profile?.email || user.email, phone:profile?.phone || null,
                transaction_id:transaction.trim(), plan:'incognito', amount:price, status:'pending'
              });
              if (error) Alert.alert('خطأ',error.message);
              else { setStatus('pending'); Alert.alert('تم','تم إرسال طلب التفعيل للإدارة.'); }
            };

            return <SafeAreaView style={styles.root}><View style={styles.box}>
              <Text style={styles.title}>🕶️ وضع التخفي</Text>
              <Text style={styles.desc}>عند التفعيل لا يظهر حسابك في قوائم الأعضاء للمستخدمين، بينما يظل ظاهرًا للإدارة ومكتوبًا بجواره «متخفى».</Text>
              {!enabled ? <Text style={styles.off}>الخدمة متوقفة حاليًا من الإدارة.</Text> : <>
                <Text style={styles.price}>{price > 0 ? price + ' جنيه / ' + days + ' يوم' : 'السعر تحدده الإدارة'}</Text>
                <TextInput value={transaction} onChangeText={setTransaction} placeholder="رقم عملية التحويل" placeholderTextColor="#77809a" style={styles.input}/>
                <TouchableOpacity style={styles.button} onPress={submit} disabled={status==='pending'}><Text style={styles.buttonText}>{status==='pending'?'الطلب قيد المراجعة':'إرسال طلب التفعيل'}</Text></TouchableOpacity>
                {status && <Text style={styles.status}>آخر طلب: {status}</Text>}
              </>}
              <TouchableOpacity style={styles.link} onPress={() => router.push('/premium-legacy')}><Text style={styles.linkText}>الميزات المدفوعة الحالية</Text></TouchableOpacity>
            </View></SafeAreaView>
          }
          const styles=StyleSheet.create({
            root:{flex:1,backgroundColor:'#0b1020',justifyContent:'center',padding:18},
            box:{backgroundColor:'#141b2d',borderRadius:20,padding:20},
            title:{fontSize:27,fontWeight:'900',color:'#fff',textAlign:'right',marginBottom:12},
            desc:{color:'#c5cee2',fontSize:15,lineHeight:24,textAlign:'right'},
            price:{color:'#72a1ff',fontSize:19,fontWeight:'800',textAlign:'right',marginVertical:18},
            input:{backgroundColor:'#0d1425',color:'#fff',padding:13,borderRadius:11,textAlign:'right'},
            button:{backgroundColor:'#4f7cff',padding:14,borderRadius:11,alignItems:'center',marginTop:12},
            buttonText:{color:'#fff',fontWeight:'900'},
            status:{color:'#a9f0bd',textAlign:'right',marginTop:10},
            off:{color:'#ff9da8',textAlign:'right',marginVertical:15},
            link:{padding:13,alignItems:'center',marginTop:12},
            linkText:{color:'#9fb8ff'}
          });
          EOF
      - name: Prebuild Android
        working-directory: app
        env:
          EXPO_NO_DOCTOR: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Fix Kotlin Compose compatibility
        working-directory: app
        shell: bash
        run: |
          set -e
          find android -type f | grep -E '\.(gradle|gradle\.kts|toml)$|gradle\.properties$' | xargs -r sed -i 's/1\.9\.24/1.9.25/g'
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "Kotlin/Compose configuration:"
          grep -R "1.9.2" android --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='*.toml' || true
      - name: Build Release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
