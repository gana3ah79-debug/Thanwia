name: Native Android Build
on:
  push:
    branches: [native-v2.1.2-full]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package.json
      - name: Install dependencies
        run: npm install
      - name: Verify source is Native
        run: python3 verify_native.py
      - name: Expo prebuild
        run: npx expo prebuild --clean
      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Reject WebView APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK=$APK SIZE=$SIZE"
          test "$SIZE" -gt 5000000
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thanwia-native-v2.1.2-release
          path: native/android/app/build/outputs/apk/release/*.apk
