name: Build Full Final APK

# Full final build pipeline: offline core + online friends/subscriptions + admin-ready app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final app configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          key='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s=re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='"+key+"'", s, count=1)
          tags=['final-features.js','payment-methods.js','admin-entry.js','ui-fixes.js','task-color-fix.js','ai-quiz-fix.js','login-screen-fix.js','quiz-screen-restore.js','registration-cleanup.js']
          for f in tags:
              tag=f'<script src="{f}"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          if "SUPABASE_KEY='"+key+"'" not in s: raise SystemExit('key verification failed')
          for f in tags:
              if f'<script src="{f}"></script>' not in s: raise SystemExit(f'{f} not injected')
          PY

      - name: Commit final source when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android_project/app/src/main/assets/www/index.html
          if git diff --cached --quiet; then echo 'No source change'; else git commit -m 'Enable full final app features' && git push || true; fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build Full APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project
      - name: Verify final APK
        shell: bash
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html > /tmp/index.html
          grep -F "SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'" /tmp/index.html
          for f in final-features.js payment-methods.js admin-entry.js ui-fixes.js task-color-fix.js ai-quiz-fix.js login-screen-fix.js quiz-screen-restore.js registration-cleanup.js; do
            grep -F "<script src=\"$f\"></script>" /tmp/index.html
            unzip -l "$APK" | grep "assets/www/$f"
          done
          if grep -Fq 'function addLoginColors' /tmp/index.html; then echo 'Unexpected inline login color function'; exit 1; fi
          echo 'FULL FINAL APK VERIFIED: AUTH CLEANUP + FULL APP FEATURES'
      - name: Upload Full Final APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-full-final-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
