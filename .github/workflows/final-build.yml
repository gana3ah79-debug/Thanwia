name: Final Thanwia APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android_project/app/src/main/assets/www')
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\basync\s+async\s+function\s+authSignIn\s*\(', 'async function authSignIn(', s)
          s=re.sub(r'(?<!async\s)\bfunction\s+authSignIn\s*\(', 'async function authSignIn(', s)
          for f in ['login-screen-fix.js','auth-theme.js','login-polish.js','admin-entry.js','admin-visibility-fix.js']:
              s=s.replace(f'<script src="{f}"></script>','')
          s=re.sub(r'<script id=["\']rihla-color-themes-js["\']>.*?</script>\s*','',s,flags=re.S|re.I)
          s=re.sub(r'(\.review-due\{[^}]*\}\.review-done\{[^}]*\})+', r'\1', s)
          tags=['final-features.js','payment-methods.js','admin-security.js','ui-fixes.js','feature-fixes.js','home-controls-fix.js','task-color-fix.js','ai-quiz-fix.js','quiz-screen-restore.js','registration-cleanup.js','navigation.js','post-login-fix.js','home-runtime-guard.js']
          for f in tags:
              tag=f'<script src="{f}"></script>'
              if tag not in s:s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          admin=root/'admin.html'
          a=admin.read_text(encoding='utf-8')
          tag='<script src="admin-payment-bridge.js"></script>'
          if tag not in a:a=a.replace('</body>',tag+'\n</body>',1)
          admin.write_text(a,encoding='utf-8')
          assert 'async async function authSignIn' not in s
          assert s.count('async function authSignIn')==1
          assert 'rihla-color-themes-js' not in s
          assert 'post-login-fix.js' in s
          assert 'home-runtime-guard.js' in s
          assert 'admin-payment-bridge.js' in a
          assert s.count('.review-due{')==1 and s.count('.review-done{')==1
          PY
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts=[]; self.in_script=False; self.cur=''
              def handle_starttag(self,t,a):
                  if t=='script': self.in_script=True; self.cur=''
              def handle_endtag(self,t):
                  if t=='script' and self.in_script:
                      if self.cur.strip(): self.parts.append(self.cur)
                      self.in_script=False
              def handle_data(self,d):
                  if self.in_script: self.cur += d
          p=P(); p.feed(Path('android_project/app/src/main/assets/www/index.html').read_text(encoding='utf-8'))
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,src in enumerate(p.parts): (out/f'{i}.js').write_text(src,encoding='utf-8')
          print('inline scripts:',len(p.parts))
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done
          for f in android_project/app/src/main/assets/www/*.js; do node --check "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        working-directory: android_project
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify final APK
        shell: bash
        run: |
          set -e
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html >/tmp/index.html
          unzip -p "$APK" assets/www/admin.html >/tmp/admin.html
          unzip -p "$APK" assets/www/home-runtime-guard.js >/tmp/home-runtime-guard.js
          ! grep -F 'rihla-color-themes-js' /tmp/index.html
          ! grep -F 'login-screen-fix.js' /tmp/index.html
          grep -F 'payment-methods.js' /tmp/index.html
          grep -F 'home-controls-fix.js' /tmp/index.html
          grep -F 'post-login-fix.js' /tmp/index.html
          grep -F 'home-runtime-guard.js' /tmp/index.html
          grep -F 'admin-payment-bridge.js' /tmp/admin.html
          grep -F 'rihlaNotifyDialog' <(unzip -p "$APK" assets/www/feature-fixes.js)
          grep -F 'plan_id' <(unzip -p "$APK" assets/www/payment-methods.js)
          grep -F 'Final guard for the post-login state' <(unzip -p "$APK" assets/www/post-login-fix.js)
          grep -F 'Final runtime guard' /tmp/home-runtime-guard.js
          ! grep -F 'async async function authSignIn' /tmp/index.html
          test "$(grep -o 'async function authSignIn' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o '\.review-due{' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o '\.review-done{' /tmp/index.html | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: Thanwia-APK-FINAL
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
