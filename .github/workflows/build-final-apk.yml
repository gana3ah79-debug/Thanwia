name: Build Clean Thanwia APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single source controller
        shell: bash
        run: |
          set -e
          grep -q 'app-core-v9.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v7.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v8.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-nav-fix-v5.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-navigation-logout-v6.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-stability-v4.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          grep -q 'function show(id)' android_project/app/src/main/assets/www/index.html
          grep -q 'SUPABASE_KEY' android_project/app/src/main/assets/www/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Normalize Supabase key and build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0','sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0')
          p.write_text(s,encoding='utf-8')
          assert 'sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0' not in s
          PY
          gradle --no-daemon :app:assembleDebug
        working-directory: android_project
      - name: Verify APK
        shell: bash
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/app-core-v9.js | grep -q 'rihlaCoreV9'
          unzip -p "$APK" assets/www/index.html | grep -q 'function show(id)'
          unzip -p "$APK" assets/www/index.html | grep -q 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
      - uses: actions/upload-artifact@v4
        with:
          name: Thanwia-Source-Clean-V9-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
