name: Build Clean Thanwia APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single navigation architecture
        shell: bash
        run: |
          set -e
          grep -q 'app-navigation-final.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          grep -q 'app-core-v10.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          grep -q 'app-core-v12.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          grep -q 'app-setup-v13.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-navigation-v14.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v9.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v7.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v8.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          test -s android_project/app/src/main/assets/www/app-navigation-final.js
          test -s android_project/app/src/main/assets/www/app-setup-v13.js
      - name: Normalize Supabase key and clean duplicate CSS
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          good='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          bad='sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          s=s.replace(bad,good)
          # Remove accidental repeated review CSS declarations, keeping one copy.
          import re
          for cls in ('review-due','review-done'):
              pat=re.compile(r'((?:\.'+cls+r'\{[^{}]*\})+)')
              def one(m):
                  block='.'+cls+'{'+re.search(r'\.'+cls+r'\{([^{}]*)\}',m.group(1)).group(1)+'}'
                  return block
              s=pat.sub(one,s)
          p.write_text(s,encoding='utf-8')
          assert bad not in s and good in s
          assert s.count('.review-due{') <= 1
          assert s.count('.review-done{') <= 1
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle --no-daemon -p android_project :app:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/app-navigation-final.js | grep -q '__rihlaNavigationFinal'
          unzip -p "$APK" assets/www/app-setup-v13.js | grep -q '__rihlaSetupV13'
          unzip -p "$APK" assets/www/index.html | grep -q 'sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          ! unzip -l "$APK" | grep -q 'assets/www/app-navigation-v14.js'
          ! unzip -l "$APK" | grep -q 'assets/www/app-core-v9.js'
          ! unzip -l "$APK" | grep -q 'assets/www/subscription.js'
          test "$(unzip -p "$APK" assets/www/index.html | grep -o '\.review-due{' | wc -l)" -le 1
      - uses: actions/upload-artifact@v4
        with:
          name: Thanwia-Root-Fix-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
