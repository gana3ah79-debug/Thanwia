name: Add Personalized Color Themes and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and fix Supabase publishable key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          current=base64.b64decode('c2JfcHVibGlzaGFibGVfRnFJNWhlSzc3c3lyLTNRSDJMUEhnX0U4MnZicS0w').decode()
          previous=base64.b64decode('c2JfcHVibGlzaGFibGVfRnFJNWhlSzc3c3lyLTNRSDJMUEhnX0U4MnZicUsw').decode()
          if previous in s:
              s=s.replace(previous,current)
              p.write_text(s,encoding='utf-8')
          if current not in s:
              raise SystemExit('ERROR: Supabase publishable key is missing or invalid')
          print('Supabase key verified')
          PY

      - name: Add theme picker and personalized color themes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* RIHLATHEMESPATCH v1 */'
          if marker not in s:
              css = r'''<style id="rihla-color-themes">
          /* RIHLATHEMESPATCH v1 */
          :root{--theme-main:#4b46b8;--theme-main2:#7067e8;--theme-soft:#f1f0ff;--theme-ink:#17204a}
          body{background:var(--theme-soft);color:var(--theme-ink)}
          .top{background:linear-gradient(135deg,var(--theme-ink),var(--theme-main))}
          .hero{background:linear-gradient(145deg,var(--theme-ink),var(--theme-main2))}
          .btn{background:linear-gradient(90deg,var(--theme-main),var(--theme-main2))}
          .btn.secondary,.pill,.tab.active{color:var(--theme-main)}
          .btn.secondary{background:var(--theme-soft)}
          .progress i{background:linear-gradient(90deg,var(--theme-main),var(--theme-main2))}
          .subject.selected{border-color:var(--theme-main);background:var(--theme-soft)}
          .nav button.active,.nav .plus{color:var(--theme-main)}
          .nav .plus{background:var(--theme-main)}
          .timer{background:conic-gradient(var(--theme-main2) 0 72%,#dfe4ee 72%)}
          .theme-card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
          .theme-title{font-size:17px;font-weight:900;margin-bottom:5px}.theme-sub{font-size:12px;color:var(--muted);margin-bottom:13px}
          .theme-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
          .theme-option{border:2px solid #edf0f5;background:#fff;border-radius:16px;padding:10px;text-align:right;display:flex;align-items:center;gap:9px;min-height:58px}
          .theme-option.active{border-color:var(--theme-main);background:var(--theme-soft)}
          .theme-swatch{width:34px;height:34px;border-radius:11px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
          .theme-option b{font-size:12px}.theme-option span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
          .theme-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#17204a;color:#fff;padding:10px 15px;border-radius:18px;font-size:12px;z-index:1000;display:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
          .theme-toast.show{display:block}
          </style>'''
              js = r'''<script id="rihla-color-themes-js">
          (function(){
            const themes={
              violet:{name:'بنفسجي هادئ',main:'#4b46b8',main2:'#7067e8',soft:'#f1f0ff',ink:'#17204a'},
              teal:{name:'تركوازي مريح',main:'#087f78',main2:'#13a89f',soft:'#eaf8f6',ink:'#123c45'},
              blue:{name:'أزرق سماوي',main:'#246bff',main2:'#48a5ff',soft:'#eef5ff',ink:'#122d52'},
              rose:{name:'وردي ناعم',main:'#b34b83',main2:'#dc78aa',soft:'#fff0f6',ink:'#4a2038'},
              green:{name:'أخضر طبيعي',main:'#16845a',main2:'#35b879',soft:'#edf9f3',ink:'#123d2c'},
              amber:{name:'ذهبي دافئ',main:'#c87918',main2:'#efa545',soft:'#fff7e9',ink:'#4a3218'}
            };
            function applyTheme(key,save){const t=themes[key]||themes.violet,r=document.documentElement;r.style.setProperty('--theme-main',t.main);r.style.setProperty('--theme-main2',t.main2);r.style.setProperty('--theme-soft',t.soft);r.style.setProperty('--theme-ink',t.ink);r.style.setProperty('--blue',t.main);r.style.setProperty('--cyan',t.main2);r.style.setProperty('--navy',t.ink);document.querySelectorAll('.theme-option').forEach(x=>x.classList.toggle('active',x.dataset.theme===key));if(save)localStorage.setItem('rihla_theme',key)}
            function picker(){let old=document.getElementById('rihla-theme-picker');if(old){old.remove();return}const current=localStorage.getItem('rihla_theme')||'violet',wrap=document.createElement('div');wrap.id='rihla-theme-picker';wrap.className='modal show';const box=document.createElement('div');box.className='sheet';box.innerHTML='<div class="row"><div><b class="theme-title">🎨 لون التطبيق</b><div class="theme-sub">اختار اللون اللي يريحك — ويتحفظ لكل طالب على جهازه</div></div><button class="icon-btn" style="background:#eef2f7;color:#17204a" id="themeClose">✕</button></div><div class="theme-options">'+Object.entries(themes).map(([k,t])=>'<button class="theme-option '+(k===current?'active':'')+'" data-theme="'+k+'"><i class="theme-swatch" style="background:linear-gradient(135deg,'+t.main+','+t.main2+')"></i><div><b>'+t.name+'</b><span>مريح للعين</span></div></button>').join('')+'</div>';wrap.appendChild(box);document.body.appendChild(wrap);box.querySelector('#themeClose').onclick=()=>wrap.remove();wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});box.querySelectorAll('.theme-option').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.theme,true);setTimeout(()=>wrap.remove(),350)})}
            function addEntry(){if(document.getElementById('rihla-theme-entry'))return;const b=document.createElement('button');b.id='rihla-theme-entry';b.className='list-item';b.style.cssText='position:fixed;left:16px;bottom:88px;z-index:30;width:190px;border-radius:16px;padding:12px;background:#fff;text-align:right;box-shadow:var(--shadow)';b.innerHTML='<span>🎨 <b>لون التطبيق</b><span class="muted" style="display:block;margin-top:3px">اختار اللون المناسب لك</span></span><span>›</span>';b.onclick=picker;document.body.appendChild(b)}
            window.rihlaChooseTheme=picker;applyTheme(localStorage.getItem('rihla_theme')||'violet',false);setTimeout(addEntry,1200);
          })();
          </script>'''
              if '</head>' in s:s=s.replace('</head>',css+'\n</head>',1)
              else:raise SystemExit('head closing tag not found')
              if '</body>' in s:s=s.replace('</body>',js+'\n</body>',1)
              else:s=s+js
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android_project/app/src/main/assets/www/index.html
          if git diff --cached --quiet; then echo 'No source change'; else git commit -m 'Add personalized color themes'; git push; fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-color-themes-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
