name: Build Thanwia Clean Core APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean navigation core
        run: |
          grep -q 'rihlaCoreV7' android_project/app/src/main/assets/www/app-core-v7.js
          grep -q 'cleanScreens' android_project/app/src/main/assets/www/app-core-v7.js
          grep -q 'window.show=function(id)' android_project/app/src/main/assets/www/app-core-v7.js
          grep -q 'app-core-v7.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          grep -q 'rihlaNavigationLogoutV6' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java && exit 1 || true
          grep -q 'rihlaNavFixV5' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java && exit 1 || true
          grep -q 'rihlaStabilityV4' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java && exit 1 || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project
      - name: Verify APK has one navigation controller
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/app-core-v7.js | grep -q 'cleanScreens'
          unzip -p "$APK" assets/www/app-core-v7.js | grep -q 'rihlaLogout'
          unzip -p "$APK" classes.dex >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Thanwia-Clean-Core-V7-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
