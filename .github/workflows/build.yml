name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android_project/app/src/main/assets/www')
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')
          current='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s=re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='"+current+"'", s, count=1)
          for f in ['login-screen-fix.js','auth-theme.js','login-polish.js','admin-entry.js','admin-visibility-fix.js']:
              s=s.replace(f'<script src="{f}"></script>','')
          tags=['final-features.js','payment-methods.js','admin-security.js','ui-fixes.js','feature-fixes.js','home-controls-fix.js','task-color-fix.js','ai-quiz-fix.js','quiz-screen-restore.js','registration-cleanup.js','navigation.js','post-login-fix.js']
          for f in tags:
              tag=f'<script src="{f}"></script>'
              if tag not in s:
                  if '</body>' in s:s=s.replace('</body>',tag+'\n</body>',1)
                  else:s += '\n'+tag+'\n'
          # Remove the huge accidental repetition of the same review CSS rules.
          s=re.sub(r'(\.review-due\{[^}]*\}\.review-done\{[^}]*\})+', r'\1', s)
          old="function addEntry(){\n    if(document.getElementById('rihla-theme-entry'))return;"
          new="function addEntry(){\n    const auth=document.getElementById('authGate');\n    if(auth && getComputedStyle(auth).display!=='none')return;\n    if(document.getElementById('rihla-theme-entry'))return;"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          admin=root/'admin.html'
          a=admin.read_text(encoding='utf-8')
          tag='<script src="admin-payment-bridge.js"></script>'
          if tag not in a:
              a=a.replace('</body>',tag+'\n</body>',1)
              admin.write_text(a,encoding='utf-8')
          for js in root.glob('*.js'):
              x=js.read_text(encoding='utf-8')
              y=x.replace('sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbqK0',current)
              if y!=x:js.write_text(y,encoding='utf-8')
          assert "SUPABASE_KEY='"+current+"'" in s
          assert 'admin-payment-bridge.js' in a
          assert 'payment-methods.js' in s and 'home-controls-fix.js' in s
          assert 'post-login-fix.js' in s
          assert s.count('.review-due{')==1 and s.count('.review-done{')==1
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: android_project
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK integrity and fixes
        shell: bash
        run: |
          set -e
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html >/tmp/index.html
          unzip -p "$APK" assets/www/admin.html >/tmp/admin.html
          grep -F "SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'" /tmp/index.html
          ! grep -F 'login-screen-fix.js' /tmp/index.html
          ! grep -F 'auth-theme.js' /tmp/index.html
          ! grep -F 'login-polish.js' /tmp/index.html
          ! grep -F 'admin-entry.js' /tmp/index.html
          ! grep -F 'admin-visibility-fix.js' /tmp/index.html
          grep -F 'home-controls-fix.js' /tmp/index.html
          grep -F 'payment-methods.js' /tmp/index.html
          grep -F 'post-login-fix.js' /tmp/index.html
          grep -F 'admin-payment-bridge.js' /tmp/admin.html
          grep -F 'rihlaOpenSubscription' <(unzip -p "$APK" assets/www/home-controls-fix.js)
          grep -F 'Do not observe attributes' <(unzip -p "$APK" assets/www/ui-fixes.js)
          grep -F 'rihlaNotifyDialog' <(unzip -p "$APK" assets/www/feature-fixes.js)
          grep -F 'admin_approve_payment_request' <(unzip -p "$APK" assets/www/admin-payment-bridge.js)
          grep -F 'amount_egp' <(unzip -p "$APK" assets/www/admin-payment-bridge.js)
          grep -F 'plan_id' <(unzip -p "$APK" assets/www/payment-methods.js)
          grep -F 'receipt_url' <(unzip -p "$APK" assets/www/payment-methods.js)
          grep -F 'rihla-explanation-v2' <(unzip -p "$APK" assets/www/quiz-screen-restore.js)
          test "$(grep -o '\.review-due{' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o '\.review-done{' /tmp/index.html | wc -l)" -eq 1
          grep -F 'Final guard for the post-login state' <(unzip -p "$APK" assets/www/post-login-fix.js)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thanwia-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
