name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inject navigation and login polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<link rel="stylesheet" href="login-polish.css">',
              '<script src="login-polish.js"></script>',
              '<script src="navigation.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</head>', tag + '\n</head>', 1) if tag.startswith('<link') else s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          for tag in tags:
              if tag not in s:
                  raise SystemExit(f'injection failed: {tag}')
          print('Navigation and login polish injected')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: android_project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify UI files inside APK
        shell: bash
        run: |
          unzip -p android_project/app/build/outputs/apk/debug/app-debug.apk assets/www/index.html > /tmp/index.html
          grep -F 'navigation.js' /tmp/index.html
          grep -F 'login-polish.js' /tmp/index.html
          grep -F 'login-polish.css' /tmp/index.html
          unzip -l android_project/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/www/(navigation.js|login-polish.js|login-polish.css)'
          echo 'UI files verified in APK'

      - name: Verify APK exists
        run: test -f android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thanwia-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
