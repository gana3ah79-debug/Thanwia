name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          current='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s=re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='"+current+"'", s, count=1)
          tags=['final-features.js','payment-methods.js','admin-entry.js','admin-visibility-fix.js','admin-security.js','ui-fixes.js','feature-fixes.js','task-color-fix.js','ai-quiz-fix.js','quiz-screen-restore.js','registration-cleanup.js','navigation.js']
          for f in tags:
              tag=f'<script src="{f}"></script>'
              if tag not in s:
                  if '</body>' in s:s=s.replace('</body>',tag+'\n</body>',1)
                  else:s += '\n'+tag+'\n'
          old="function addEntry(){\n    if(document.getElementById('rihla-theme-entry'))return;"
          new="function addEntry(){\n    const auth=document.getElementById('authGate');\n    if(auth && getComputedStyle(auth).display!=='none')return;\n    if(document.getElementById('rihla-theme-entry'))return;"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert "SUPABASE_KEY='"+current+"'" in s
          for f in ['login-screen-fix.js','auth-theme.js','login-polish.js']:
              assert f'<script src="{f}"></script>' not in s
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: android_project
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK integrity and login safety
        shell: bash
        run: |
          set -e
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html >/tmp/index.html
          grep -F "SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'" /tmp/index.html
          ! grep -F 'login-screen-fix.js' /tmp/index.html
          ! grep -F 'auth-theme.js' /tmp/index.html
          ! grep -F 'login-polish.js' /tmp/index.html
          grep -F 'rihla-explanation-v2' <(unzip -p "$APK" assets/www/quiz-screen-restore.js)
          grep -F 'Do not observe attributes' <(unzip -p "$APK" assets/www/ui-fixes.js)
          grep -F 'if(b.textContent!==text)' <(unzip -p "$APK" assets/www/feature-fixes.js)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thanwia-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
