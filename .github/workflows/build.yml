name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Rebuild marker: restore quiz setup screen before questions and enforce third-secondary-only source policy.
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inject final app fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          current='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'
          s=re.sub(r"SUPABASE_KEY='[^']*'", "SUPABASE_KEY='"+current+"'", s, count=1)
          tags=['final-features.js','payment-methods.js','admin-entry.js','ui-fixes.js','task-color-fix.js','ai-quiz-fix.js','login-screen-fix.js','quiz-screen-restore.js']
          for f in tags:
              tag=f'<script src="{f}"></script>'
              if tag not in s:s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          assert "SUPABASE_KEY='"+current+"'" in s
          for f in tags: assert f'<script src="{f}"></script>' in s
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: android_project
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify final fixes inside APK
        shell: bash
        run: |
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/www/index.html >/tmp/index.html
          grep -F "SUPABASE_KEY='sb_publishable_FqI5heK77syr-3QHh2LPHg_E82vbq-0'" /tmp/index.html
          for f in final-features.js payment-methods.js admin-entry.js ui-fixes.js task-color-fix.js ai-quiz-fix.js login-screen-fix.js quiz-screen-restore.js; do grep -F "$f" /tmp/index.html; unzip -l "$APK" | grep "assets/www/$f"; done
          grep -F 'مصدر ونطاق الأسئلة' <(unzip -p "$APK" assets/www/quiz-screen-restore.js)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thanwia-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
