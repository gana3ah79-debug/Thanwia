name: Wanas APK Build Test
on:
  push:
    branches:
      - wanas-apk-build-20260927
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source archive
        shell: bash
        run: |
          echo "runner ok"
          ls -lh build/chunks | head
          cat build/chunks/*.b64 | tr -d '
' | base64 -d > /tmp/wanas-source.tar.gz
          tar -tzf /tmp/wanas-source.tar.gz >/dev/null
          echo "archive ok: $(stat -c%s /tmp/wanas-source.tar.gz) bytes"
